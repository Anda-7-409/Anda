<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 安答：校园AI Agent助手</title>
    <!-- 第一版不要样式文件！！！样式内联，与 index.html 保持一致——祖传规矩，别手痒 (¬‿¬) -->
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "PingFang SC","Microsoft YaHei", "Segoe UI", sans-serif; min-height: 100vh; background: linear-gradient(135deg, #dbeafe 0%, #ede9fe 100%); background-attachment: fixed; }
        .container { max-width: 420px; margin: 60px auto; padding: 24px; }
        .logo { text-align: center; font-size: 28px; font-weight: bold; color: #1a73e8; margin-bottom: 8px; }
        .title { text-align: center; font-size: 22px; font-weight: 600; color: #333; letter-spacing: 2px; line-height: 1.3; }
        .subtitle { text-align: center; color: #666; font-size: 14px; margin: 8px 0 24px; letter-spacing: 0.5px; line-height: 1.7; }
        .register-form { background: #fff; border-radius: 16px; padding: 32px 28px; box-shadow: 0 1px 2px rgba(26,115,232,.10), 0 4px 12px rgba(26,115,232,.10), 0 20px 40px rgba(26,115,232,.14); border: 1px solid rgba(255,255,255,.8); }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 14px; color: #333; margin-bottom: 6px; font-weight: 500; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; box-shadow: inset 0 1px 3px rgba(0,0,0,.06); line-height: 1.5; }
        .form-group input:focus { outline: none; border-color: #1a73e8; box-shadow: 0 0 0 3px rgba(26,115,232,.15); }
        .submit-btn { width: 100%; padding: 11px; background: linear-gradient(135deg, #1a73e8, #6366f1, #9333ea, #6366f1, #1a73e8); background-size: 300% 300%; animation: gradient-move 5s ease infinite; color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; letter-spacing: 1px; cursor: pointer; box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 2px 0 #4c1d95, 0 6px 16px rgba(124,92,240,.45); transition: all .15s ease; }
        .submit-btn:disabled { background: #9dc3f5; cursor: not-allowed; box-shadow: none; }
        .submit-btn:active:not(:disabled) { transform: translateY(2px); box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 0 0 #4c1d95, 0 3px 8px rgba(124,92,240,.4); }
        .submit-btn:hover:not(:disabled) { filter: brightness(1.08); }
        #register-msg { text-align: center; font-size: 13px; color: #e53935; min-height: 18px; margin-top: 8px; }
        .auth-links { margin-top: 16px; text-align: center; font-size: 13px; }
        .auth-links a { color: #1a73e8; text-decoration: none; margin: 0 8px; }
        .footer { text-align: center; color: #999; font-size: 12px; margin-top: 32px; }
        @keyframes gradient-move {
          0% { background-position: 0% 50%; }
          50% { background-position: 100% 50%; }
          100% { background-position: 0% 50%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">安 答</div>
        </div>
        <div class="main">
            <div class="auth-section">
                <div class="title">注册账号</div>
                <div class="subtitle">填好下面的小信息，激活邮件马上飞进你的邮箱～</div>
                <!-- JS fetch 提交到 /auth/register，成功后提示查收激活邮件（QQ邮箱SMTP发送激活链接，点完链接账号才算真的活了 (๑•̀ㅂ•́)و✧） -->
                <form id="register-form" class="register-form">
                    <div class="form-group">
                        <label for="username">用户名</label>
                        <input type="text" id="username" name="username" placeholder="用户名叫什么呀~" required>
                    </div>
                    <div class="form-group">
                        <label for="password">密码</label>
                        <input type="password" id="password" name="password" placeholder="密码至少 6 位，悄悄告诉我~" minlength="6" required>
                    </div>
                    <div class="form-group">
                        <label for="email">邮箱</label>
                        <input type="email" id="email" name="email" placeholder="邮箱填这里哦~" required>
                    </div>
                    <button type="submit" class="submit-btn">注册 ✧</button>
                    <div id="register-msg"></div>
                </form>
                <div class="auth-links">
                    <a href="../index.html">已有账号？返回登录</a>
                </div>
            </div>
        </div>
        <div class="footer">
            <div class="copyright">© 2026 安答. All rights reserved.</div>
        </div>
    </div>

    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault(); // 拦下整页跳转，表单的事交给 JS
            const msg = document.getElementById('register-msg');
            const btn = e.target.querySelector('button');
            btn.disabled = true;
            msg.textContent = '';
            try {
                const res = await fetch('/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('username').value.trim(),
                        password: document.getElementById('password').value,
                        email: document.getElementById('email').value.trim(),
                    }),
                });
                const data = await res.json();
                if (res.ok) {
                    msg.style.color = '#43a047';
                    // 注册成功不跳转：账号这会儿还在"沉睡"，得去QQ邮箱点激活链接（GET /auth/verify?token=xxx）才醒得过来 (´･ω･`)
                    msg.textContent = '注册成功！ヾ(≧▽≦*)o 激活邮件已飞向你的邮箱，查收并点链接完成激活（没收到记得翻翻垃圾箱哦~）';
                } else {
                    msg.textContent = data.message || '注册没成功呢 (＞﹏＜) 再检查一下信息嘛~';
                }
            } catch (err) {
                msg.textContent = '网络开小差啦 (´･ω･`) 稍后再试一次嘛~';
            } finally {
                btn.disabled = false;
            }
        });
    </script>
    
        <script>
    (function () {
        const live2d_path = 'https://gcore.jsdelivr.net/npm/live2d-widgets@1.0.1/dist/';
        function loadResource(url, type) {
            return new Promise(function (resolve, reject) {
                let tag;
                if (type === 'css') {
                    tag = document.createElement('link');
                    tag.rel = 'stylesheet';
                    tag.href = url;
                } else if (type === 'js') {
                    tag = document.createElement('script');
                    tag.type = 'module';
                    tag.src = url;
                }
                if (tag) {
                    tag.onload = function () { resolve(url); };
                    tag.onerror = function () { reject(url); };
                    document.head.appendChild(tag);
                }
            });
        }
        Promise.all([
            loadResource(live2d_path + 'waifu.css', 'css'),
            loadResource(live2d_path + 'waifu-tips.js', 'js'),
        ]).then(function () {
            initWidget({
                waifuPath: live2d_path + 'waifu-tips.json',
                cdnPath: 'https://gcore.jsdelivr.net/gh/fghrsh/live2d_api/',
                cubism2Path: live2d_path + 'live2d.min.js',
                cubism5Path: 'https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js',
                tools: ['hitokoto', 'asteroids', 'switch-model', 'switch-texture', 'photo', 'info', 'quit'],
                logLevel: 'warn',
                drag: false,
            });
        });
    })();
    </script>
</body>
</html>
