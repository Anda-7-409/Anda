<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>忘记密码 - 安答：校园AI Agent助手</title>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <img src="../assets/logo.png" alt="logo">
            </div>
        </div>
        <div class="main">
            <div class="auth-section">
                <div class="title">忘记密码</div>
                <div class="subtitle">请输入您的注册邮箱，我们将发送重置链接至您的邮箱</div>
                <form id="forgot-password-form" class="forgot-password-form" action="/auth/forgot-password" method="POST">
                    <div class="form-group">
                        <label for="email">注册邮箱</label>
                        <input type="email" id="email" name="email" placeholder="请输入注册时使用的邮箱" required>
                    </div>
                    <button type="submit" class="submit-btn">发送重置链接</button>
                </form>
                <div class="auth-links">
                    <a href="../index.html">想起密码了？返回登录</a>
                </div>
            </div>
        </div>
        <div class="footer">
            <div class="copyright">© 2026 安答. All rights reserved.</div>
        </div>
    </div>
</body>
</html>
