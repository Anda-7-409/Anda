<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>重置密码 - 安答：校园AI Agent助手</title>
    <!-- 第一版不要样式文件！！！样式内联，与 register.html 保持一致 -->
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Microsoft YaHei", sans-serif; background: #f5f7fa; }
        .container { max-width: 420px; margin: 60px auto; padding: 24px; }
        .logo { text-align: center; font-size: 28px; font-weight: bold; color: #1a73e8; margin-bottom: 8px; }
        .title { text-align: center; font-size: 22px; font-weight: bold; color: #333; }
        .subtitle { text-align: center; color: #666; font-size: 14px; margin: 8px 0 24px; }
        .reset-form { background: #fff; border-radius: 8px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 14px; color: #333; margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
        .submit-btn { width: 100%; padding: 10px; background: #1a73e8; color: #fff; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; }
        .submit-btn:disabled { background: #9dc3f5; cursor: not-allowed; }
        .submit-btn:hover:not(:disabled) { background: #1557b0; }
        #reset-msg { text-align: center; font-size: 13px; color: #e53935; min-height: 18px; margin-top: 8px; }
        .auth-links { margin-top: 16px; text-align: center; font-size: 13px; }
        .auth-links a { color: #1a73e8; text-decoration: none; margin: 0 8px; }
        .footer { text-align: center; color: #999; font-size: 12px; margin-top: 32px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">安答</div>
        </div>
        <div class="main">
            <div class="auth-section">
                <div class="title">重置密码</div>
                <!-- 从邮件重置链接打开（?token=xxx）→ 提交 {token, new_password} 到 /auth/reset-password（token 15分钟有效、一次性） -->
                <div class="subtitle">请输入新密码完成重置</div>
                <form id="reset-form" class="reset-form">
                    <div class="form-group">
                        <label for="new_password">新密码</label>
                        <input type="password" id="new_password" name="new_password" placeholder="请输入新密码（至少6位）" minlength="6" required>
                    </div>
                    <div class="form-group">
                        <label for="confirm_password">确认新密码</label>
                        <input type="password" id="confirm_password" name="confirm_password" placeholder="请再次输入新密码" minlength="6" required>
                    </div>
                    <button type="submit" class="submit-btn">重置密码</button>
                    <div id="reset-msg"></div>
                </form>
                <div class="auth-links">
                    <a href="../index.html">返回登录</a>
                    <a href="./forgot-password.html">重新申请重置</a>
                </div>
            </div>
        </div>
        <div class="footer">
            <div class="copyright">© 2026 安答. All rights reserved.</div>
        </div>
    </div>

    <script>
        const msg = document.getElementById('reset-msg'); // 提示信息元素
        const form = document.getElementById('reset-form'); // 重置表单

        // 从 URL 读取一次性重置 token（邮件链接格式：reset-password.html?token=xxx）
        const resetToken = new URLSearchParams(location.search).get('token');

        // 无 token（直接访问或链接已失效）：隐藏表单并提示重新申请
        if (!resetToken) {
            form.style.display = 'none';
            msg.textContent = '链接无效或已过期，请返回登录页重新申请重置';
        }

        // 重置表单提交事件：凭一次性 token 提交新密码
        form.addEventListener('submit', async (e) => {
            e.preventDefault(); // 阻止整页跳转
            const btn = e.target.querySelector('button'); // 提交按钮
            const newPwd = document.getElementById('new_password').value;
            const confirmPwd = document.getElementById('confirm_password').value;

            // 前端校验：两次密码一致
            if (newPwd !== confirmPwd) {
                msg.textContent = '两次输入的密码不一致';
                return;
            }

            btn.disabled = true;
            msg.textContent = '';
            try {
                const res = await fetch('/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: resetToken, new_password: newPwd }), // 不再传邮箱，凭 token 重置
                });
                const data = await res.json();
                if (res.ok) {
                    msg.style.color = '#43a047';
                    msg.textContent = '密码重置成功，即将跳转到登录页...';
                    setTimeout(() => { location.href = '../index.html'; }, 1200);
                } else {
                    msg.textContent = data.message || '重置失败，链接可能已失效，请重新申请';
                    btn.disabled = false;
                }
            } catch (err) {
                msg.textContent = '网络错误，请稍后重试';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
