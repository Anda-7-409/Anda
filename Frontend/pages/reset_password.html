<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>重置密码 - 安答：校园AI Agent助手</title>
    <link rel="stylesheet" href="../assets/style.css">
    <style>
    #reset-msg { text-align: center; font-size: 13px; color: #e53935; min-height: 18px; margin-top: 8px; }
    .login-form { animation: fadeInUp .5s ease both; }
    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(24px); }
        to { opacity: 1; transform: translateY(0); }
    }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">安 答</div>
        </div>
        <div class="main">
            <div class="auth-section">
                <div class="title">重置密码</div>
                <!-- 从邮件重置链接打开（?token=xxx）→ 提交 {token, new_password} 到 /auth/reset_password（token 15分钟有效、一次性） -->
                <div class="subtitle">请输入新密码完成重置</div>
                <form id="reset-form" class="login-form">
                    <div class="form-group">
                        <label for="new_password">新密码</label>
                        <input type="password" id="new_password" name="new_password" placeholder="请输入新密码（至少6位）" minlength="6" required>
                    </div>
                    <div class="form-group">
                        <label for="confirm_password">确认新密码</label>
                        <input type="password" id="confirm_password" name="confirm_password" placeholder="请再次输入新密码" minlength="6" required>
                    </div>
                    <button type="submit" class="login-btn">重置密码</button>
                    <div id="reset-msg"></div>
                </form>
                <div class="auth-links">
                    <a href="../index.html">返回登录</a>
                    <a href="./forgot_password.html">重新申请重置</a>
                </div>
            </div>
        </div>
        <div class="footer">
            <div class="copyright">© 2026 安答. All rights reserved.</div>
        </div>
    </div>

    <script>
        const msg = document.getElementById('reset-msg'); // 提示信息元素
        const form = document.getElementById('reset-form'); // 重置表单

        // 从 URL 读取一次性重置 token（邮件链接格式：reset_password.html?token=xxx）
        const resetToken = new URLSearchParams(location.search).get('token');

        // 无 token（直接访问或链接已失效）：隐藏表单并提示重新申请
        if (!resetToken) {
            form.style.display = 'none';
            msg.textContent = '链接无效或已过期，请返回登录页重新申请重置';
        }

        // 重置表单提交事件：凭一次性 token 提交新密码
        form.addEventListener('submit', async (e) => {
            e.preventDefault(); // 阻止整页跳转
            const btn = e.target.querySelector('button'); // 提交按钮
            const newPwd = document.getElementById('new_password').value;
            const confirmPwd = document.getElementById('confirm_password').value;

            // 前端校验：两次密码一致
            if (newPwd !== confirmPwd) {
                msg.textContent = '两次输入的密码不一致';
                return;
            }

            btn.disabled = true;
            msg.textContent = '';
            try {
                const res = await fetch('/auth/reset_password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: resetToken, new_password: newPwd }), // 不再传邮箱，凭 token 重置
                });
                const data = await res.json();
                if (res.ok) {
                    msg.style.color = '#43a047';
                    msg.textContent = '密码重置成功，即将跳转到登录页...';
                    setTimeout(() => { location.href = '../index.html'; }, 1200);
                } else {
                    msg.textContent = data.message || '重置失败，链接可能已失效，请重新申请';
                    btn.disabled = false;
                }
            } catch (err) {
                msg.textContent = '网络错误，请稍后重试';
                btn.disabled = false;
            }
        });
    </script>
    <script>
    (function () {
        const live2d_path = 'https://gcore.jsdelivr.net/npm/live2d-widgets@1.0.1/dist/';
        function loadResource(url, type) {
            return new Promise(function (resolve, reject) {
                let tag;
                if (type === 'css') {
                    tag = document.createElement('link');
                    tag.rel = 'stylesheet';
                    tag.href = url;
                } else if (type === 'js') {
                    tag = document.createElement('script');
                    tag.type = 'module';
                    tag.src = url;
                }
                if (tag) {
                    tag.onload = function () { resolve(url); };
                    tag.onerror = function () { reject(url); };
                    document.head.appendChild(tag);
                }
            });
        }
        Promise.all([
            loadResource(live2d_path + 'waifu.css', 'css'),
            loadResource(live2d_path + 'waifu-tips.js', 'js'),
        ]).then(function () {
            initWidget({
                waifuPath: live2d_path + 'waifu-tips.json',
                cdnPath: 'https://gcore.jsdelivr.net/gh/fghrsh/live2d_api/',
                cubism2Path: live2d_path + 'live2d.min.js',
                cubism5Path: 'https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js',
                tools: ['hitokoto', 'asteroids', 'switch-model', 'switch-texture', 'photo', 'info', 'quit'],
                logLevel: 'warn',
                drag: false,
            });
        });
    })();
    </script>
</body>
</html>
