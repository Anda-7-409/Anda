<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- 程序服务主要实现页 --集成AI_agnet -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>安答 · AI Agent 工作台</title>
<style>
    /* 程序服务主要实现页 --集成AI_agnet */
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; font-family:"Microsoft YaHei",sans-serif; background:#f5f7fa; color:#333; font-size:14px; }
a { color:#1a73e8; text-decoration:none; }
/* 全局样式 */

/* 三栏总布局 */
/* 左中右布局 */
.layout { display:flex; height:100vh; width:100vw; overflow:hidden; }
.col { display:flex; flex-direction:column; height:100%; background:#fff; }
.col-left { width:280px; border-right:1px solid #e4e7ed; }
.col-center { flex:1; }
.col-right { width:320px; border-left:1px solid #e4e7ed; }

/* 通用面板 */
.panel { display:flex; flex-direction:column; overflow:hidden; }
.panel-header { flex-shrink:0; padding:12px 16px; font-weight:bold; font-size:14px; border-bottom:1px solid #eef0f3; background:#fafbfc; display:flex; align-items:center; justify-content:space-between; }
.add-btn { cursor:pointer; font-size:17px; font-weight:bold; color:#4f6ef7; line-height:1; user-select:none; width:22px; height:22px; display:inline-flex; align-items:center; justify-content:center; border-radius:50%; background:#eef2ff; }
.add-btn:hover { color:#fff; background:#4f6ef7; transform:scale(1.15); transition:all .15s; }
.panel-body { flex:1; overflow-y:auto; padding:8px; }

/* 左栏上下分栏 */
.col-left .file-manager { flex:0 0 45%; border-bottom:1px solid #eef0f3; }
.col-left .history { flex:1; }

/* 文件管理器树 */
.fm-tree { list-style:none; padding-left:6px; }
.fm-tree li { padding:4px 6px; cursor:pointer; border-radius:4px; font-size:13px; }
.fm-tree li:hover { background:#eef5ff; }
.fm-tree .folder::before { content:"📁 "; }
.fm-tree .file::before { content:"📄 "; }

/* 历史对话 */
.history-new { width:100%; padding:9px; background:linear-gradient(135deg,#4f8cff 0%,#1a73e8 50%,#6366f1 100%); color:#fff; border:none; border-radius:8px; cursor:pointer; font-size:13px; font-weight:600; margin-bottom:10px;box-shadow:0 2px 0 #1557b0,0 4px 10px rgba(26,115,232,.30);transition:all .2s ease; }
.history-new:hover { filter:brightness(1.1);transform:translateY(-1px); }
.history-new:active { transform:translateY(1px); }
.history-item {  padding:10px 34px 10px 12px; border-radius:6px; cursor:pointer; margin-bottom:4px; position:relative; }
.del-btn { position:absolute; right:8px; top:50%; transform:translateY(-50%);width:22px; height:22px; display:inline-flex; align-items:center; justify-content:center;border-radius:50%; background:#eef2ff; color:#4f6ef7; font-size:17px; font-weight:bold; line-height:1; cursor:pointer; user-select:none; transition:all .15s; }
.del-btn:hover { color:#fff; background:#e5484d; transform:translateY(-50%) scale(1.15); }
.history-item:hover { background:#eef5ff; }
.history-item.active { background:#e0edff; }
.history-title { font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.history-time { font-size:11px; color:#999; margin-top:2px; }

/* 中间对话区 */
.chat-header { flex-shrink:0; padding:14px 20px; border-bottom:1px solid #eef0f3; background:#fff; display:flex; align-items:center; justify-content:space-between; }
.chat-header .title { font-size:16px; font-weight:bold; }
.chat-header .status { font-size:12px; color:#43a047; }
.chat-messages { flex:1; overflow-y:auto; padding:20px; background:#f5f7fa; }
.msg { margin-bottom:16px; display:flex; }
.msg.user { justify-content:flex-end; }
.msg.tool { justify-content:center; }
.msg .bubble { max-width:70%; padding:10px 14px; border-radius:10px; line-height:1.6; white-space:pre-wrap; word-break:break-word; }
.msg.user .bubble { background:linear-gradient(135deg,#4f8cff,#1a73e8); color:#fff; border-bottom-right-radius:2px;box-shadow:0 3px 10px rgba(26,115,232,.30);  }
.msg.ai .bubble { background:#fff; color:#333; border:1px solid #eef0f4; border-bottom-left-radius:2px; box-shadow:0 1px 2px rgba(16,24,40,.04),0 4px 10px rgba(16,24,40,.06);transition:box-shadow .2s ease;}
.msg.ai .bubble:hover{box-shadow:0 2px 4px rgba(16,24,40,.06),08px 18px rgba(16,24,40,.10);}
.msg.tool .bubble { background:#f0f4ff; color:#1a73e8; font-size:12px; border:1px dashed #c3d6f9; }
.msg.tool .bubble.ok { background:#f0faf2; color:#2e7d32; border:1px solid #b9e0c4; }
.msg.tool .bubble.err { background:#fff5f5; color:#c0392b; border:1px solid #f5c6c6; }
.chat-input { flex-shrink:0; padding:12px 20px; border-top:1px solid #eef0f3; background:#fff; }
.chat-input textarea { width:100%; resize:none; border:1px solid #e4e7ed; border-radius:8px; padding:10px; font-size:14px; font-family:inherit; outline:none; height:60px;transition:border-color .2s ease, box-shadow .2s ease;  }
.chat-input textarea:focus { border-color:#1a73e8;box-shadow:0 0 0 3px rgba(26,115,232,.15); }
.chat-input-row { display:flex; align-items:center; justify-content:space-between; margin-top:8px; }
.upload-btn { width:34px; height:34px; border:none; border-radius:50%; background:#f0f4ff;color:#1a73e8; font-size:18px; cursor:pointer; line-height:1; user-select:none; transition:all .15s; }
/* 模型选择已改为后端自动路由，前端不再提供手动切换 */
.upload-btn:hover { background:#1a73e8; color:#fff; transform:scale(1.1); }
.send-btn { padding:8px 24px; height:34px;background:linear-gradient(180deg,#69b1ff 0%,#5048e5 45%,#722ed1 100%); color:#fff; border:none; border-radius:20px; cursor:pointer; font-size:14px;font-weight:600;box-shadow:0 2px 0 #1557b0,0 4px 12px rgba(26,115,232,.35);transition:all .2s ease; }
.send-btn:disabled { background:#9dc3f5; cursor:not-allowed; }
.send-btn:hover:not(:disabled) { transform:translateY(-1px);box-shadow:0 2px 0 #1557b0,0 6px 18px rgba(26,115,232,.5); }
.send-btn:active:not(:disabled){transform:translateY(1px);}
/* 斜杠命令菜单 */
.slash-menu { display:none; position:absolute; bottom:100%; left:20px; width:320px; max-height:240px; overflow-y:auto; background:#fff; border:1px solid #e4e7ed; border-radius:10px; box-shadow:0 8px 24px rgba(16,24,40,.14); padding:6px; z-index:10; }
.slash-menu.show { display:block; }
.slash-group { font-size:11px; color:#999; padding:6px 10px 2px; }
.slash-item { padding:8px 10px; border-radius:8px; cursor:pointer; }
.slash-item:hover, .slash-item.hl { background:#eef5ff; }
.slash-item .name { font-size:13px; font-weight:600; color:#1a73e8; }
.slash-item .desc { font-size:12px; color:#666; margin-top:2px; }
/* 提醒面板 */
.reminder-box { display:none; padding:10px 12px 0; gap:6px; }
.reminder-box.show { display:flex; }
.reminder-box input { border:1px solid #e4e7ed; border-radius:6px; font-size:13px; outline:none; }
#reminder-input { flex:1; padding:7px 10px; }
#reminder-time { padding:6px 8px; color:#666; }
.reminder-box button { border:none; background:#722ed1; color:#fff; border-radius:6px; padding:0 14px; cursor:pointer; font-size:13px; }
.reminder-item { border-left-color:#722ed1; background:#faf8ff; }
.reminder-item:hover { background:#f3edff; }
.reminder-item .time { font-size:11px; color:#722ed1; font-weight:600; margin-top:3px; }
/* 右栏上下分栏 */
.col-right .schedule { flex:0 0 50%; border-bottom:1px solid #eef0f3; }
.col-right .reminders { flex:1; }

/* 日程卡片 */
.sch-item { padding:12px 14px; border-left:3px solid #1a73e8; background:#f8faff; border-radius:8px; margin-bottom:10px; box-shadow:0 1px 3px rgba(26,115,232,.08);transition:all .2s ease; }
.sch-item:hover { background:#f0f4ff;transform:translateX(2px);box-shadow:0 2px 8px rgba(26,115,232,.15); }
.sch-item .t { font-weight:600; font-size:13px; }
.sch-item .meta { font-size:12px; color:#666; margin-top:3px; }
/* 备忘录输入框 */
.memo-box { display:none; padding:10px 12px 0; gap:8px; }
.memo-box.show { display:flex; }
.memo-box input { flex:1; border:1px solid #e4e7ed; border-radius:6px; padding:7px 10px; font-size:13px; outline:none; }
.memo-box input:focus { border-color:#f59e0b; }
.memo-box button { border:none; background:#f59e0b; color:#fff; border-radius:6px; padding:0 14px; cursor:pointer; font-size:13px; }

/* 备忘录条目（橙色系，和蓝色课程区分开） */
.memo-item { border-left-color:#f59e0b; background:#fffaf0; }
.memo-item:hover { background:#fff3dd; }
.memo-del { float:right; cursor:pointer; color:#c9a227; margin-left:6px; }
.memo-del:hover { color:#e5484d; }
/* 技能/MCP 标签 */
.section-title { font-size:12px; color:#999; margin:10px 4px 6px; }
.tag-row { display:flex; flex-wrap:wrap; gap:6px; padding:0 4px; }
.tag { padding:4px 10px; background:#eef5ff; color:#1a73e8; border-radius:12px; font-size:12px; transition:all .15s ease;border:1px solid transparent;}
.tag:hover { background:#dce8ff; transform:translateY(-2px); box-shadow:0 3px 8px rgba(26,115,232,.20); }
</style>
</head>
<body>
    <!-- 三栏总布局 -->
<div class="layout">
  <!-- 左栏 -->
  <aside class="col col-left">
    <!-- 文件管理器 -->
    <section class="panel file-manager">
        <!-- 文件管理器标题 -->
      <div class="panel-header"><span>📂 文件管理器</span></div>
        <!-- 文件管理器树 -->
      <div class="panel-body"><ul class="fm-tree" id="fm-tree"></ul></div>
        <!-- 文件管理器树点击事件 -->
        <script>
            document.getElementById('fm-tree').addEventListener('click', (e) => {
                if (e.target.tagName === 'LI') {
                    e.target.classList.toggle('active');
                }
            });
        </script>
    </section>
    <!-- 历史对话 -->
    <section class="panel history">
        <!-- 历史对话标题 -->
      <div class="panel-header"><span>💬 历史对话</span></div>
        <!-- 历史对话内容 -->
      <div class="panel-body">
        <!-- 新对话按钮 -->
        <button class="history-new" id="new-chat">+ 新对话</button>
        <!-- 历史对话列表 -->
        <div id="history-list"></div>
      </div>
    </section>
  </aside>

  <!-- 中栏 -->
  <!-- 对话区 -->
  <main class="col col-center">
    <!-- 对话区标题 -->
    <div class="chat-header">
        <!-- 对话区标题 -->
      <span class="title">安答 AI Agent</span>
        <!-- 对话区状态 -->
      <span class="status">● 在线</span>
    </div>
    <!-- 对话区消息 -->
    <div class="chat-messages" id="chat-messages"></div>
    <!-- 对话区输入 -->
    <div class="chat-input">
        <!-- 对话区输入文本框 -->
      <textarea id="chat-input" placeholder="输入自然语言以与我们的安答对话~ （Ctrl+Enter 发送）"></textarea>
            <!-- 斜杠命令菜单（/ 呼出） -->
      <div class="slash-menu" id="slash-menu"></div>
        <!-- 对话区输入发送按钮 -->
      <div class="chat-input-row">
  <button class="upload-btn" id="upload-btn" title="上传文件 / 照片">＋</button>
  <input type="file" id="file-input" multiple hidden>
  <button class="send-btn" id="send-btn">发送</button>
</div>
  </main>

  <!-- 右栏 -->
  <!-- 日程卡片 -->
  <aside class="col col-right">
    <!-- 日程卡片标题 -->
    <section class="panel schedule">
        <!-- 日程卡片标题 -->
      <div class="panel-header"><span>今日日程</span><span class="add-btn" id="add-memo-btn" title="添加日程">+</span></div>
      <div class="memo-box" id="memo-box">
        <input id="memo-input" placeholder="输入备忘录，回车确认">
        <button id="memo-confirm">添加</button>
      </div>  
      <!-- 日程卡片内容 -->
      <div class="panel-body" id="schedule-list"></div>
    </section>
        <!-- 提醒卡片 -->
    <section class="panel reminders">
      <div class="panel-header"><span>提醒</span><span class="add-btn" id="add-reminder-btn" title="添加提醒">+</span></div>
      <div class="reminder-box" id="reminder-box">
        <input id="reminder-input" placeholder="提醒内容，如：交高数作业">
        <input type="time" id="reminder-time">
        <button id="reminder-confirm">添加</button>
      </div>
      <div class="panel-body" id="reminder-list"></div>
    </section>
  </aside>
</div>

<script>
// 未登录跳回首页
// 从登录状态获取 token
const token = localStorage.getItem('token');
// 如果 token 不存在，跳回首页
if (!token) { location.href = '../index.html'; }
// 定义 API 函数
const api = async (url, opts={}) => {
  try {
    // 发送 API 请求
    const res = await fetch(url, { headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+token }, ...opts });
    // 解析 JSON：500 等错误页不是 JSON，也不丢真实状态码（status 0 只代表真的连不上）
    let data = {};
    try { data = await res.json(); } catch {}
    // 返回 API 响应（status 供调用方区分 401/网络失败等场景）
    return { ok: res.ok, status: res.status, data };
    // 如果 API 请求失败，返回错误响应
  } catch { return { ok:false, status:0, data:{} }; }
};
const $ = id => document.getElementById(id);

// ===== 左栏上：文件管理器（真实数据：GET /upload 拉取当前登录用户自己上传的文件） =====
async function loadFiles() {
  const box = $('fm-tree');
  box.innerHTML = '';
  const fmt = n => n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(1) + ' KB' : (n / 1048576).toFixed(1) + ' MB';
  const { ok, status, data } = await api('/upload/');
  if (status === 401) {
    box.innerHTML = '<li style="color:#c0392b;cursor:default">登录已过期，正在跳转登录页…</li>';
    setTimeout(() => location.href = '../index.html', 1200);
    return;
  }
  if (status === 0 || status >= 500) {
    // 加载瞬间后端可能正在重启：自动重试直到拿到结果，不再一次性摆烂
    box.innerHTML = `<li style="color:#999;cursor:default">${status === 0 ? '连不上后端(8000)' : '后端出错(HTTP ' + status + ')'}，5秒后自动重试…</li>`;
    setTimeout(loadFiles, 5000);
    return;
  }
  if (!ok || !data || data.code !== 0) {
    // 兑底：任何异常都不影响页面布局
    box.innerHTML = `<li style="color:#999;cursor:default">获取失败：${(data && (data.message || data.detail)) || 'HTTP ' + status}</li>`;
    return;
  }
  const files = data.data || [];
  const root = document.createElement('li');
  root.className = 'folder';
  root.textContent = `我上传的文件 (${files.length})`;
  const ul = document.createElement('ul');
  ul.className = 'fm-tree'; ul.style.paddingLeft = '16px';
  if (!files.length) {
    const empty = document.createElement('li');
    empty.style.color = '#999'; empty.style.cursor = 'default';
    empty.textContent = '还没有上传过文件，去中间对话框点 ＋ 试试吧 ~';
    ul.appendChild(empty);
  }
  files.forEach(f => {
    const li = document.createElement('li');
    li.className = 'file';
    li.textContent = `${f.file_name} (${fmt(f.size)})`;
    li.title = `${f.file_name}\n${fmt(f.size)} · ${f.uploaded_at || ''}`;
    ul.appendChild(li);
  });
  root.appendChild(ul);
  box.appendChild(root);
}
loadFiles();

// ===== 左栏下：历史对话（localStorage 持久化） =====
// 从 localStorage 中获取历史对话
let history = JSON.parse(localStorage.getItem('agent_history') || '[]');
// 渲染历史对话列表
let currentChatId = null;
// 保存历史对话到 localStorage
function saveHistory(){ localStorage.setItem('agent_history', JSON.stringify(history)); }
// 渲染历史对话列表
function renderHistory() {
    // 清空历史对话列表
  const box = $('history-list'); box.innerHTML = '';
    // 渲染历史对话列表
    // 遍历历史对话列表
    // 创建列表项
    // 设置列表项类名
    // 设置列表项文本内容
    // 将列表项添加到父元素
  history.forEach(h => {
    // 渲染当前列表项
    // 创建列表项
    // 设置列表项类名
    // 设置列表项文本内容
    // 将列表项添加到父元素
    const div = document.createElement('div');
    // 设置列表项类名
    // 设置列表项文本内容
    // 将列表项添加到父元素
    div.className = 'history-item' + (h.id===currentChatId?' active':'');
    // 设置列表项文本内容
    // 将列表项添加到父元素
    div.innerHTML = `<div class="history-title">${h.title}</div><div class="history-time">${h.time}</div>`;
    const del = document.createElement('span');
del.className = 'del-btn';
del.textContent = '−';
del.title = '删除该对话';
del.onclick = e => {
  e.stopPropagation();
  history = history.filter(x => x.id !== h.id);
  saveHistory();
  if (currentChatId === h.id) {
    currentChatId = null;
    if (history.length) selectChat(history[0].id); else newChat();
  } else renderHistory();
};
div.appendChild(del);
    // 点击列表项时，切换到该对话
    // 渲空对话消息
    // 遍历该对话的所有消息
    // 渲染消息
    // 将消息添加到父元素
    // 渲染历史对话列表
    div.onclick = () => selectChat(h.id);
    // 将列表项添加到父元素
    box.appendChild(div);
  });
}
// 切换到指定对话
function selectChat(id) {
    // 切换到指定对话
  currentChatId = id;
    // 渲空对话消息
  const h = history.find(x=>x.id===id);
    // 渲染指定对话的所有消息
    // 渲空对话消息
  $('chat-messages').innerHTML = '';
    // 渲染指定对话的所有消息
    // 渁�历该对话的所有消息
    // 渲染消息
    // 将消息添加到父元素
    // 渲染历史对话列表
  (h?.messages||[]).forEach(m => appendMessage(m.role, m.content, m.tool));
    // 渲染历史对话列表
  renderHistory();
}
function newChat() {
    // 创建新对话
  currentChatId = 'c_' + Date.now();
    // 渲空对话消息
  $('chat-messages').innerHTML='';
    // 渲染新对话的所有消息
    // 渲染新对话的所有消息
    // 渲染新对话的所有消息
    // 渲染新对话的所有消息
    // 渲染新对话的所有消息
  history.unshift({ id:currentChatId, title:'新对话', time:new Date().toLocaleString(), messages:[] });
    // 保存新对话到 localStorage
  saveHistory(); renderHistory(); $('chat-messages').innerHTML='';
}
// 点击创建新对话按钮时，创建新对话
$('new-chat').onclick = newChat;

// ===== 中栏：对话 =====
// 渲染消息
function appendMessage(role, content, toolName) {
    // 渲染消息
  const box = $('chat-messages');
  const div = document.createElement('div');
    // 设置消息类名
  div.className = 'msg ' + (role==='user'?'user':(role==='tool'?'tool':'ai'));
    // 设置消息文本内容
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
    // 设置消息文本内容
  bubble.textContent = toolName ? `调用工具: ${toolName}\n${content}` : content;
    // 将消息添加到父元素
  div.appendChild(bubble); box.appendChild(div);
    // 滚动到最底部
  box.scrollTop = box.scrollHeight;
}
async function send() {
    // 发送消息
    // 渲空对话消息
  const input = $('chat-input'); const text = input.value.trim();
    // 检查输入是否为空
  if (!text) return;
    // 禁用发送按钮
    // 渲空输入框
    // 渲染用户消息
  const btn = $('send-btn'); btn.disabled = true; input.value='';
    // 渲染用户消息
  appendMessage('user', text);
  if (!currentChatId) newChat();
    // 渲染新对话的所有消息
  const h = history.find(x=>x.id===currentChatId);

  h.messages.push({role:'user', content:text});
  if (h.title==='新对话') h.title = text.slice(0,15);
  saveHistory(); renderHistory();
  try {
    const {ok, data} = await api('/agent/chat', { method:'POST', body:JSON.stringify({utterance:text}) });
    if (ok && data?.data) {
      const d = data.data;
      (d.tool_calls||[]).forEach(t => appendMessage('tool', JSON.stringify(t.result||{}, null, 2), t.tool_name));
      appendMessage('ai', d.answer || data.message || '（无回复）');
      h.messages.push({role:'ai', content:d.answer||''});
    } else {
      appendMessage('ai', '服务暂不可用（' + (data.message||'后端未启动') + '）');
    }
  } catch {
    appendMessage('ai', '网络错误，请稍后重试');
  } finally { saveHistory(); btn.disabled = false; input.focus(); }
}
$('send-btn').onclick = send;
// ===== 输入区左下角：上传文件 —— 逻辑链：选择→校验→上传→进度→结果→失败可重试 =====
const MAX_SIZE = 10 * 1024 * 1024;
const MAX_FILES = 5;
const OK_EXT = ['png','jpg','jpeg','gif','webp','pdf','doc','docx','xls','xlsx','ppt','pptx','txt','md','csv','zip'];
const fmtSize = n => n < 1024 ? n + ' B' : n < 1048576 ? (n/1024).toFixed(1) + ' KB' : (n/1048576).toFixed(1) + ' MB';

// 上传结果写进当前对话历史（role:'tool'，刷新/切对话仍可见）
function pushToolHistory(content) {
  if (!currentChatId) newChat();
  const h = history.find(x => x.id === currentChatId);
  if (h) { h.messages.push({ role:'tool', content, tool:'upload' }); saveHistory(); }
}

// 新建一个可动态更新进度的 tool 气泡
function makeBubble() {
  const div = document.createElement('div');
  div.className = 'msg tool';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  div.appendChild(bubble);
  const box = $('chat-messages');
  box.appendChild(div); box.scrollTop = box.scrollHeight;
  return bubble;
}

function uploadFile(file) {
  return new Promise(resolve => {
    const bubble = makeBubble();
    const ext = (file.name.split('.').pop() || '').toLowerCase();
    const head = `📎 ${file.name} (${fmtSize(file.size)})`;
    const fail = msg => { bubble.className = 'bubble err'; bubble.textContent = `${head}\n✕ ${msg}`; resolve(); };
    if (!OK_EXT.includes(ext)) return fail(`不支持 .${ext || '未知'} 格式的文件`);
    if (file.size > MAX_SIZE) return fail('超过 10MB 上限，压缩一下再传吧');
    if (!file.size) return fail('文件内容为空');
    const send = () => {
      bubble.className = 'bubble';
      bubble.onclick = null;
      bubble.textContent = `${head}\n上传中 0%`;
      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/upload/');
      xhr.setRequestHeader('Authorization', 'Bearer ' + token);
      xhr.upload.onprogress = ev => {
        if (ev.lengthComputable) bubble.textContent = `${head}\n上传中 ${Math.round(ev.loaded / ev.total * 100)}%`;
      };
      xhr.onload = () => {
        let res = {};
        try { res = JSON.parse(xhr.responseText) || {}; } catch {}
        if (xhr.status === 200 && res.code === 0) {
          bubble.className = 'bubble ok';
          const fid = (res.data && res.data.file_id) || '-';
          bubble.textContent = `${head}\n✓ 上传成功 · file_id: ${fid}`;
          pushToolHistory(`上传 ${file.name} 成功（file_id: ${fid}）`);
          if (typeof loadFiles === 'function') loadFiles(); // 左栏文件管理器同步刷新
          return resolve();
        }
        if (xhr.status === 401) {
          fail((res.detail || res.message || '登录已过期') + '，即将返回登录页');
          localStorage.removeItem('token');
          return setTimeout(() => location.href = '../index.html', 1000);
        }
        bubble.className = 'bubble err';
        bubble.textContent = `${head}\n✕ 上传失败：${res.message || res.detail || 'HTTP ' + xhr.status}\n（点击气泡重试）`;
        bubble.onclick = send;
        resolve();
      };
      xhr.onerror = () => {
        bubble.className = 'bubble err';
        bubble.textContent = `${head}\n✕ 上传失败：后端(8000)未启动或网络中断\n（点击气泡重试）`;
        bubble.onclick = send;
        resolve();
      };
      const form = new FormData();
      form.append('file', file);
      xhr.send(form);
    };
    send();
  });
}

$('upload-btn').onclick = () => $('file-input').click();
$('file-input').addEventListener('change', async e => {
  const files = [...e.target.files];
  e.target.value = '';
  if (!files.length) return;
  if (files.length > MAX_FILES) appendMessage('tool', `一次最多 ${MAX_FILES} 个文件，先传前 ${MAX_FILES} 个哦`, 'upload');
  for (const f of files.slice(0, MAX_FILES)) await uploadFile(f);
});
// ===== 模型选择：由后端自动路由，前端不再指定模型 =====
$('chat-input').addEventListener('keydown', e => { if (e.ctrlKey && e.key==='Enter') send(); });

// ===== 右栏上：今日日程（调 /schedule/today，失败用 mock） =====
(async () => {
  const box = $('schedule-list');
  const {ok, data} = await api('/schedule/today');
  const courses = (ok && data?.data?.length) ? data.data : [
    {name:'高等数学', classroom:'教南109', start_slot:1, end_slot:2, teacher:'花老师'},
    {name:'大学英语', classroom:'教南307', start_slot:3, end_slot:4, teacher:'余老师'},
  ];
  box.innerHTML = courses.length ? courses.map(c=>`
    <div class="sch-item"><div class="t">${c.name}</div>
    <div class="meta">第${c.start_slot}-${c.end_slot}节 · ${c.classroom||''} ${c.teacher||''}</div></div>`).join('')
    : '<div style="color:#999;text-align:center;padding:20px">今日无课程</div>';
})();
// ===== 今日日程加号：自定义备忘录（存 localStorage，刷新不丢） =====
const memos = JSON.parse(localStorage.getItem('memos') || '[]');
const memoBox = $('memo-box');
function saveMemos() { localStorage.setItem('memos', JSON.stringify(memos)); }

function renderMemo(text) {
  const div = document.createElement('div');
  div.className = 'sch-item memo-item';
  const t = document.createElement('div');
  t.className = 't'; t.textContent = text;
  const del = document.createElement('span');
  del.className = 'memo-del'; del.textContent = '×';
  del.onclick = () => { div.remove(); memos.splice(memos.indexOf(text), 1); saveMemos(); };
  t.appendChild(del);
  div.appendChild(t);
  $('schedule-list').appendChild(div);
}

function addMemo() {
  const input = $('memo-input'); const text = input.value.trim();
  if (!text) return;
  memos.push(text); saveMemos(); renderMemo(text);
  input.value = ''; memoBox.classList.remove('show');
}

$('add-memo-btn').onclick = () => { memoBox.classList.toggle('show'); $('memo-input').focus(); };
$('memo-input').addEventListener('keydown', e => { if (e.key === 'Enter') addMemo(); });
$('memo-confirm').onclick = addMemo;
memos.forEach(renderMemo);
// ===== 右栏下：技能 & MCP（对照 plan.md 的 skill/ 与 MCP/） =====
const skills = [
  {name:'search', desc:'查询课表、提醒等用户数据'},
  {name:'web_search', desc:'网络搜索:查询最新消息等'},
  {name:'system', desc:'日程写入、提醒设置等系统操作'},
  {name:'gpa', desc:'根据成绩与学分计算 GPA'},
  {name:'review', desc:'生成复习计划'},
];
const mcps = [
  {name:'mcp_map', desc:'高德地图：位置、路径、导航'},
  {name:'mcp_weather', desc:'天气查询：课前出行建议'},
];
// ===== 斜杠菜单：/ 呼出技能与 MCP =====
const menu = $('slash-menu'), chatInput = $('chat-input');
const allCmds = [
  ...skills.map(s => ({name:s.name, desc:s.desc, type:'技能'})),
  ...mcps.map(m => ({name:m.name, desc:m.desc, type:'MCP'})),
];
let slashOn = false, hlIndex = 0, flatCmds = [], flatItems = [];

const closeSlash = () => { menu.classList.remove('show'); slashOn = false; };

function pickCmd(c) {
  chatInput.value = '/' + c.name + ' ' + chatInput.value.replace(/^\/\S*\s*/, '');
  closeSlash(); chatInput.focus();
}

function updateHl() {
  flatItems.forEach((el,i) => el.classList.toggle('hl', i===hlIndex));
  flatItems[hlIndex]?.scrollIntoView({block:'nearest'});
}

function showSlash(hits) {
  menu.innerHTML = '';
  ['技能','MCP'].forEach(type => {
    const arr = hits.filter(c => c.type===type);
    if (!arr.length) return;
    const g = document.createElement('div'); g.className='slash-group';
    g.textContent = type==='技能' ? '技能 Skill' : 'MCP 服务器';
    menu.appendChild(g);
    arr.forEach(c => {
      const item = document.createElement('div'); item.className='slash-item';
      const n = document.createElement('div'); n.className='name'; n.textContent = '/' + c.name;
      const d = document.createElement('div'); d.className='desc'; d.textContent = c.desc;
      item.append(n, d);
      item.onclick = () => pickCmd(c);
      menu.appendChild(item);
      flatCmds.push(c); flatItems.push(item);
    });
  });
  hlIndex = 0; updateHl();
  menu.classList.add('show'); slashOn = true;
}

chatInput.addEventListener('input', () => {
  flatCmds = []; flatItems = [];
  const v = chatInput.value;
  if (!v.startsWith('/')) { closeSlash(); return; }
  const q = v.slice(1).split(/\s/)[0].toLowerCase();
  const hits = allCmds.filter(c => c.name.includes(q) || c.desc.toLowerCase().includes(q));
  hits.length ? showSlash(hits) : closeSlash();
});

chatInput.addEventListener('keydown', e => {
  if (!slashOn) return;
  if (e.key==='Escape') closeSlash();
  else if (e.key==='ArrowDown') { e.preventDefault(); hlIndex=(hlIndex+1)%flatItems.length; updateHl(); }
  else if (e.key==='ArrowUp') { e.preventDefault(); hlIndex=(hlIndex-1+flatItems.length)%flatItems.length; updateHl(); }
  else if (e.key==='Enter') { e.preventDefault(); pickCmd(flatCmds[hlIndex]); }
});
// ===== 提醒面板（存 localStorage，刷新不丢） =====
const reminders = JSON.parse(localStorage.getItem('reminders') || '[]');
const reminderBox = $('reminder-box');
function saveReminders() { localStorage.setItem('reminders', JSON.stringify(reminders)); }
function renderReminder(r) {
  const div = document.createElement('div');
  div.className = 'sch-item reminder-item';
  const t = document.createElement('div');
  t.className = 't'; t.textContent = r.text;
  const del = document.createElement('span');
  del.className = 'memo-del'; del.textContent = '×';
  del.onclick = () => { div.remove(); reminders.splice(reminders.indexOf(r), 1); saveReminders(); };
  t.appendChild(del);
  div.appendChild(t);
  if (r.time) { const meta = document.createElement('div'); meta.className='time'; meta.textContent='⏰ ' + r.time; div.appendChild(meta); }
  $('reminder-list').appendChild(div);
}
function addReminder() {
  const input = $('reminder-input'); const text = input.value.trim();
  if (!text) return;
  const r = { text, time: $('reminder-time').value };
  reminders.push(r); saveReminders(); renderReminder(r);
  input.value = ''; $('reminder-time').value = '';
  reminderBox.classList.remove('show');
}
$('add-reminder-btn').onclick = () => { reminderBox.classList.toggle('show'); $('reminder-input').focus(); };
$('reminder-input').addEventListener('keydown', e => { if (e.key === 'Enter') addReminder(); });
$('reminder-confirm').onclick = addReminder;
reminders.forEach(renderReminder);

// 初始化
renderHistory();
// 初始化时，选择第一个对话
if (history.length) selectChat(history[0].id); else newChat();
</script>
