<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- 程序服务主要实现页 --集成AI_agnet -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>安答 · AI Agent 工作台</title>
<style>
    /* 程序服务主要实现页 --集成AI_agnet */
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; font-family:"Microsoft YaHei",sans-serif; background:#f5f7fa; color:#333; font-size:14px; }
a { color:#1a73e8; text-decoration:none; }
/* 全局样式 */

/* 三栏总布局 */
/* 左中右布局 */
.layout { display:flex; height:100vh; width:100vw; overflow:hidden; }
.col { display:flex; flex-direction:column; height:100%; background:#fff; }
.col-left { width:280px; border-right:1px solid #e4e7ed; }
.col-center { flex:1; }
.col-right { width:320px; border-left:1px solid #e4e7ed; }

/* 通用面板 */
.panel { display:flex; flex-direction:column; overflow:hidden; }
.panel-header { flex-shrink:0; padding:12px 16px; font-weight:bold; font-size:14px; border-bottom:1px solid #eef0f3; background:#fafbfc; display:flex; align-items:center; justify-content:space-between; }
.add-btn { cursor:pointer; font-size:17px; font-weight:bold; color:#4f6ef7; line-height:1; user-select:none; width:22px; height:22px; display:inline-flex; align-items:center; justify-content:center; border-radius:50%; background:#eef2ff; }
.add-btn:hover { color:#fff; background:#4f6ef7; transform:scale(1.15); transition:all .15s; }
.panel-body { flex:1; overflow-y:auto; padding:8px; }

/* 左栏上下分栏 */
.col-left .file-manager { flex:0 0 45%; border-bottom:1px solid #eef0f3; }
.col-left .history { flex:1; }

/* 资源管理器（VS Code 式树状图，浅色与页面协调） */
/* 折叠箭头（closed 时旋转 -90° 收拢） */
.fm-chevron { flex-shrink:0; width:12px; font-size:9px; color:#8a94a6; text-align:center; cursor:pointer; transition:transform .12s; }
.fm-chevron.closed { transform:rotate(-90deg); }
/* 根行：箭头 + 标题，工具条 hover 浮现 */
.fm-root { display:flex; align-items:center; gap:4px; padding:5px 10px; font-size:13px; font-weight:600; user-select:none; cursor:pointer; }
.fm-root:hover { background:#eef5ff; }
.fm-toolbar { margin-left:auto; display:none; gap:2px; }
.fm-root:hover .fm-toolbar { display:flex; }
.fm-toolbar button { border:none; background:transparent; color:#5b6b83; cursor:pointer; font-size:13px; width:22px; height:22px; padding:0; line-height:1; border-radius:4px; }
.fm-toolbar button:hover { background:#dce8ff; color:#1a73e8; }
/* 树：层级缩进 + 竖线导轨（资源管理器的 ├─ 线） */
.fm-tree, .fm-children { list-style:none; }
.fm-tree { padding:0 4px 4px; }
.fm-children { margin:0 0 0 10px; padding-left:8px; border-left:1px solid #e4e7ed; }
.fm-row { display:flex; align-items:center; gap:5px; padding:3px 6px; border-radius:4px; font-size:13px; color:#333; white-space:nowrap; overflow:hidden; cursor:pointer; }
.fm-row:hover { background:#eef5ff; }
.fm-row.selected { background:#e0edff; }
.fm-row .fm-name { overflow:hidden; text-overflow:ellipsis; }
.fm-row .fm-count { color:#999; font-size:11px; margin-left:2px; }
.fm-row .fm-size { color:#999; font-size:11px; margin-left:auto; padding-left:8px; flex-shrink:0; }
.fm-row .fm-dl { display:none; flex-shrink:0; border:none; background:transparent; color:#1a73e8; cursor:pointer; font-size:12px; padding:2px 4px; border-radius:4px; }
.fm-row:hover .fm-dl { display:inline; }
.fm-row .fm-dl:hover { background:#dce8ff; }
.fm-row .fm-ref { display:none; flex-shrink:0; border:none; background:transparent; color:#722ed1; cursor:pointer; font-size:12px; padding:2px 4px; border-radius:4px; }
.fm-row:hover .fm-ref { display:inline; }
.fm-row .fm-ref:hover { background:#f3edff; }
.fm-row .fm-del { display:none; flex-shrink:0; border:none; background:transparent; color:#e5484d; cursor:pointer; font-size:12px; padding:2px 4px; border-radius:4px; }
.fm-row:hover .fm-del { display:inline; }
.fm-row .fm-del:hover { background:#ffecec; }
.fm-tree .fm-msg { padding:3px 6px 3px 27px; font-size:12px; color:#999; cursor:default; }
/* 文件预览遮罩层 */
.preview-mask { display:none; position:fixed; inset:0; background:rgba(16,24,40,.45); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); z-index:50; align-items:center; justify-content:center; }
.preview-mask.show { display:flex; }
.preview-card { width:min(860px,92vw); height:min(620px,86vh); background:#fff; border-radius:16px; box-shadow:0 24px 64px rgba(16,24,40,.35); display:flex; flex-direction:column; overflow:hidden; animation:pv-pop .22s cubic-bezier(.34,1.56,.64,1); }
@keyframes pv-pop { from { opacity:0; transform:scale(.92) translateY(12px); } to { opacity:1; transform:scale(1) translateY(0); } }
.preview-bar { flex-shrink:0; display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 16px; border-bottom:1px solid #eef0f3; font-size:13px; font-weight:600; background:linear-gradient(180deg,#fbfcfe,#fff); }
.pv-title { display:flex; align-items:center; gap:8px; overflow:hidden; min-width:0; }
.pv-title .pv-icon { font-size:18px; flex-shrink:0; }
.pv-title .pv-ext { flex-shrink:0; font-size:10px; font-weight:700; text-transform:uppercase; color:#1a73e8; background:#e8f0fe; border-radius:4px; padding:2px 6px; letter-spacing:.5px; }
.preview-bar .pv-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.preview-bar .pv-actions { display:flex; gap:8px; flex-shrink:0; }
.preview-bar button#preview-download { border:none; background:linear-gradient(135deg,#4f8cff,#1a73e8); color:#fff; border-radius:8px; padding:6px 14px; cursor:pointer; font-size:12px; font-weight:600; box-shadow:0 2px 6px rgba(26,115,232,.3); transition:all .15s; }
.preview-bar button#preview-download:hover { filter:brightness(1.1); transform:translateY(-1px); }
.preview-bar button#preview-download:active { transform:translateY(0); }
.preview-bar button#preview-close { border:1px solid #e4e7ed; background:#fff; color:#5b6b83; border-radius:8px; width:30px; height:28px; cursor:pointer; font-size:14px; line-height:1; padding:0; transition:all .15s; }
.preview-bar button#preview-close:hover { background:#ffecec; border-color:#f5c6c6; color:#e5484d; }
.preview-body { flex:1; overflow:auto; background:#f5f7fa; display:flex; align-items:center; justify-content:center; }
.preview-body.pv-img { background:repeating-conic-gradient(#eef0f3 0% 25%, #fff 0% 50%) 50% / 20px 20px; }
.preview-body img { max-width:100%; max-height:100%; object-fit:contain; padding:16px; box-sizing:border-box; transition:transform .25s ease; cursor:zoom-in; }
.preview-body img.pv-zoomed { transform:scale(1.8); cursor:zoom-out; }
.preview-body iframe { width:100%; height:100%; border:none; background:#fff; }
.preview-body pre { width:100%; height:100%; overflow:auto; margin:0; padding:18px 20px; font-size:12.5px; line-height:1.7; white-space:pre-wrap; word-break:break-word; background:#fff; color:#333; font-family:Consolas,'Courier New',monospace; tab-size:4; }
.pv-loading { width:34px; height:34px; border:3px solid #dce8ff; border-top-color:#1a73e8; border-radius:50%; animation:pv-spin .8s linear infinite; }
@keyframes pv-spin { to { transform:rotate(360deg); } }
.pv-error { text-align:center; color:#c0392b; font-size:13px; }
.pv-error .pv-err-icon { display:block; font-size:36px; margin-bottom:10px; }
@media (prefers-reduced-motion: reduce) { .preview-card { animation:none; } }
/* 轻提示 */
.toast { position:fixed; left:50%; bottom:90px; transform:translateX(-50%); background:#333c4d; color:#fff; padding:9px 18px; border-radius:8px; font-size:13px; z-index:60; box-shadow:0 6px 20px rgba(16,24,40,.25); }

/* 历史对话 */
.history-new { width:100%; padding:9px; background:linear-gradient(135deg,#4f8cff 0%,#1a73e8 50%,#6366f1 100%); color:#fff; border:none; border-radius:8px; cursor:pointer; font-size:13px; font-weight:600; margin-bottom:10px;box-shadow:0 2px 0 #1557b0,0 4px 10px rgba(26,115,232,.30);transition:all .2s ease; }
.history-new:hover { filter:brightness(1.1);transform:translateY(-1px); }
.history-new:active { transform:translateY(1px); }
.history-item {  padding:10px 34px 10px 12px; border-radius:6px; cursor:pointer; margin-bottom:4px; position:relative; }
.del-btn { position:absolute; right:8px; top:50%; transform:translateY(-50%);width:22px; height:22px; display:inline-flex; align-items:center; justify-content:center;border-radius:50%; background:#eef2ff; color:#4f6ef7; font-size:17px; font-weight:bold; line-height:1; cursor:pointer; user-select:none; transition:all .15s; }
.del-btn:hover { color:#fff; background:#e5484d; transform:translateY(-50%) scale(1.15); }
.history-item:hover { background:#eef5ff; }
.history-item.active { background:#e0edff; }
.history-title { font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.history-time { font-size:11px; color:#999; margin-top:2px; }

/* 中间对话区 */
.chat-header { flex-shrink:0; padding:14px 20px; border-bottom:1px solid #eef0f3; background:#fff; display:flex; align-items:center; justify-content:space-between; }
.chat-header .title { font-size:16px; font-weight:bold; }
.chat-header .status { font-size:12px; color:#43a047; }
.chat-messages { flex:1; overflow-y:auto; padding:20px; background:#f5f7fa; }
.msg { margin-bottom:16px; display:flex; }
.msg.user { justify-content:flex-end; }
.msg.tool { justify-content:center; }
.msg .bubble { max-width:70%; padding:10px 14px; border-radius:10px; line-height:1.6; white-space:pre-wrap; word-break:break-word; }
.msg.user .bubble { background:linear-gradient(135deg,#4f8cff,#1a73e8); color:#fff; border-bottom-right-radius:2px;box-shadow:0 3px 10px rgba(26,115,232,.30);  }
.msg.ai .bubble { background:#fff; color:#333; border:1px solid #eef0f4; border-bottom-left-radius:2px; box-shadow:0 1px 2px rgba(16,24,40,.04),0 4px 10px rgba(16,24,40,.06);transition:box-shadow .2s ease;}
.msg.ai .bubble:hover{box-shadow:0 2px 4px rgba(16,24,40,.06),08px 18px rgba(16,24,40,.10);}
.msg.tool .bubble { background:#f0f4ff; color:#1a73e8; font-size:12px; border:1px dashed #c3d6f9; }
.msg.tool .bubble.ok { background:#f0faf2; color:#2e7d32; border:1px solid #b9e0c4; }
.msg.tool .bubble.err { background:#fff5f5; color:#c0392b; border:1px solid #f5c6c6; }
.chat-input { flex-shrink:0; padding:12px 20px; border-top:1px solid #eef0f3; background:#fff; transition:background .15s, box-shadow .15s; }
/* 拖文件悬停在输入区上的高亮提示 */
.chat-input.drag-over { background:#eef5ff; box-shadow:inset 0 0 0 2px #1a73e8; }
/* 引用文件卡片栏：＠引用/拖入的文件显示为小卡片，点 ✕ 一键移除 */
.ref-bar { display:none; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
.ref-bar.show { display:flex; }
.ref-chip { display:inline-flex; align-items:center; gap:6px; max-width:240px; padding:3px 6px 3px 10px; background:#eef5ff; border:1px solid #dce8ff; color:#1a73e8; border-radius:14px; font-size:12px; user-select:none; }
.ref-chip .chip-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; }
.ref-chip .chip-x { flex-shrink:0; width:16px; height:16px; border:none; border-radius:50%; background:#dce8ff; color:#1a73e8; font-size:11px; line-height:1; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; padding:0; }
.ref-chip .chip-x:hover { background:#e5484d; color:#fff; }
/* 导航工具卡片：目的地/耗时/路线要点/一键打开高德（替代裸 JSON 气泡） */
.msg.tool .bubble.nav-card { text-align:left; max-width:82%; padding:12px 16px; background:#f0fff4; border:1px solid #b7ebc6; color:#1f6b3a; box-shadow:0 2px 10px rgba(31,107,58,.10); }
.nav-card .nav-head { font-weight:bold; font-size:13.5px; color:#14532d; margin-bottom:4px; }
.nav-card .nav-head .nav-origin { font-weight:normal; font-size:11.5px; color:#4a9d68; }
.nav-card .nav-meta { font-size:12.5px; color:#2f855a; margin-bottom:6px; }
.nav-card .nav-steps { margin:0 0 10px 18px; padding:0; font-size:12.5px; color:#276749; }
.nav-card .nav-steps li { margin:2px 0; }
.nav-card .nav-go { display:inline-block; padding:6px 16px; border-radius:8px; background:linear-gradient(135deg,#22c55e,#16a34a); color:#fff; font-size:12.5px; font-weight:600; text-decoration:none; box-shadow:0 2px 6px rgba(22,163,74,.30); transition:all .15s; }
.nav-card .nav-go:hover { filter:brightness(1.08); transform:translateY(-1px); }
.chat-input textarea { width:100%; resize:none; border:1px solid #e4e7ed; border-radius:8px; padding:10px; font-size:14px; font-family:inherit; outline:none; height:60px;transition:border-color .2s ease, box-shadow .2s ease;  }
.chat-input textarea:focus { border-color:#1a73e8;box-shadow:0 0 0 3px rgba(26,115,232,.15); }
.chat-input-row { display:flex; align-items:center; justify-content:space-between; margin-top:8px; }
.upload-btn { width:34px; height:34px; border:none; border-radius:50%; background:#f0f4ff;color:#1a73e8; font-size:18px; cursor:pointer; line-height:1; user-select:none; transition:all .15s; }
/* 模型选择已改为后端自动路由，前端不再提供手动切换 */
.upload-btn:hover { background:#1a73e8; color:#fff; transform:scale(1.1); }
/* 麦克风录音中：红色呼吸 */
.mic-rec { background:#ff4d4f !important; color:#fff !important; animation:mic-pulse 1.2s ease-in-out infinite; }
@keyframes mic-pulse { 0%,100%{ box-shadow:0 0 0 0 rgba(255,77,79,.45);} 50%{ box-shadow:0 0 0 7px rgba(255,77,79,0);} }
.send-btn { padding:8px 24px; height:34px;background:linear-gradient(180deg,#69b1ff 0%,#5048e5 45%,#722ed1 100%); color:#fff; border:none; border-radius:20px; cursor:pointer; font-size:14px;font-weight:600;box-shadow:0 2px 0 #1557b0,0 4px 12px rgba(26,115,232,.35);transition:all .2s ease; }
.send-btn:disabled { background:#9dc3f5; cursor:not-allowed; }
.send-btn:hover:not(:disabled) { transform:translateY(-1px);box-shadow:0 2px 0 #1557b0,0 6px 18px rgba(26,115,232,.5); }
.send-btn:active:not(:disabled){transform:translateY(1px);}
/* 斜杠命令菜单 */
.slash-menu { display:none; position:absolute; bottom:100%; left:20px; width:320px; max-height:240px; overflow-y:auto; background:#fff; border:1px solid #e4e7ed; border-radius:10px; box-shadow:0 8px 24px rgba(16,24,40,.14); padding:6px; z-index:10; }
.slash-menu.show { display:block; }
.slash-group { font-size:11px; color:#999; padding:6px 10px 2px; }
.slash-item { padding:8px 10px; border-radius:8px; cursor:pointer; }
.slash-item:hover, .slash-item.hl { background:#eef5ff; }
.slash-item .name { font-size:13px; font-weight:600; color:#1a73e8; }
.slash-item .desc { font-size:12px; color:#666; margin-top:2px; }
/* 提醒面板 */
.reminder-box { display:none; padding:10px 12px 0; gap:6px; }
.reminder-box.show { display:flex; }
.reminder-box input { border:1px solid #e4e7ed; border-radius:6px; font-size:13px; outline:none; }
#reminder-input { flex:1; padding:7px 10px; }
#reminder-time { padding:6px 8px; color:#666; }
.reminder-box button { border:none; background:#722ed1; color:#fff; border-radius:6px; padding:0 14px; cursor:pointer; font-size:13px; }
.reminder-item { border-left-color:#722ed1; background:#faf8ff; }
.reminder-item:hover { background:#f3edff; }
.reminder-item .time { font-size:11px; color:#722ed1; font-weight:600; margin-top:3px; }
/* 右栏上下分栏 */
.col-right .schedule { flex:0 0 50%; border-bottom:1px solid #eef0f3; }
.col-right .reminders { flex:1; }

/* 日程卡片 */
.sch-item { padding:12px 14px; border-left:3px solid #1a73e8; background:#f8faff; border-radius:8px; margin-bottom:10px; box-shadow:0 1px 3px rgba(26,115,232,.08);transition:all .2s ease; }
.sch-item:hover { background:#f0f4ff;transform:translateX(2px);box-shadow:0 2px 8px rgba(26,115,232,.15); }
.sch-item .t { font-weight:600; font-size:13px; }
.sch-item .meta { font-size:12px; color:#666; margin-top:3px; }
.sch-del { float:right; cursor:pointer; color:#9aa4b2; margin-left:6px; font-weight:bold; opacity:0; transition:opacity .15s; }
.sch-item:hover .sch-del { opacity:1; }
.sch-del:hover { color:#e5484d; }
/* 备忘录输入框 */
.memo-box { display:none; padding:10px 12px 0; gap:8px; }
.memo-box.show { display:flex; }
.memo-box input { flex:1; border:1px solid #e4e7ed; border-radius:6px; padding:7px 10px; font-size:13px; outline:none; }
.memo-box input:focus { border-color:#f59e0b; }
.memo-box button { border:none; background:#f59e0b; color:#fff; border-radius:6px; padding:0 14px; cursor:pointer; font-size:13px; }

/* 备忘录条目（橙色系，和蓝色课程区分开） */
.memo-item { border-left-color:#f59e0b; background:#fffaf0; }
.memo-item:hover { background:#fff3dd; }
.memo-del { float:right; cursor:pointer; color:#c9a227; margin-left:6px; }
.memo-del:hover { color:#e5484d; }
/* 技能/MCP 标签 */
.section-title { font-size:12px; color:#999; margin:10px 4px 6px; }
.tag-row { display:flex; flex-wrap:wrap; gap:6px; padding:0 4px; }
.tag { padding:4px 10px; background:#eef5ff; color:#1a73e8; border-radius:12px; font-size:12px; transition:all .15s ease;border:1px solid transparent;}
.tag:hover { background:#dce8ff; transform:translateY(-2px); box-shadow:0 3px 8px rgba(26,115,232,.20); }
/* ===== 手机端适配：左右栏改为抽屉，中栏独占全屏；电脑端不受影响 ===== */
.m-btn { display:none; }
.m-backdrop { display:none; }
@media (max-width:768px) {
  .m-btn { display:inline-flex; align-items:center; justify-content:center; width:32px; height:32px; border:none; background:#eef5ff; color:#1a73e8; border-radius:8px; font-size:16px; cursor:pointer; flex-shrink:0; }
  .m-btn:active { background:#dce8ff; }
  .col-left, .col-right { position:fixed; top:0; bottom:0; z-index:80; width:min(85vw,320px); box-shadow:0 0 40px rgba(16,24,40,.25); transition:transform .25s ease; }
  .col-left { left:0; transform:translateX(-100%); }
  .col-right { right:0; transform:translateX(100%); }
  .col-left.open, .col-right.open { transform:translateX(0); }
  .m-backdrop { display:block; position:fixed; inset:0; background:rgba(16,24,40,.45); z-index:70; opacity:0; pointer-events:none; transition:opacity .25s; }
  .m-backdrop.show { opacity:1; pointer-events:auto; }
  .chat-header { gap:10px; }
  .chat-header .title { flex:1; text-align:center; font-size:15px; }
  .msg .bubble { max-width:88%; }
  .chat-messages { padding:12px; }
  .chat-input { padding:10px 12px; }
}
.think { margin-bottom:6px; border-left:3px solid #a5b4fc; background:#f8fafc; border-radius:6px; font-size:12px; color:#64748b; }
.think summary { cursor:pointer; padding:4px 8px; user-select:none; }
.think .think-body { padding:4px 10px 8px; white-space:pre-wrap; max-height:220px; overflow:auto; }
/* 思维面板内的工具调用行：跟着思维流走，点击可展开返回详情 */
.think .tool-item { margin:6px 0; border:1px dashed #c7d2fe; border-radius:6px; background:#eef2ff; }
.think .tool-item summary { cursor:pointer; padding:3px 8px; color:#4f46e5; user-select:none; list-style:none; }
.think .tool-item summary::-webkit-details-marker { display:none; }
.think .tool-item summary::after { content:' >'; font-weight:600; }
.think .tool-item[open] summary::after { content:' ⌄'; }
.think .tool-item .tool-detail { margin:0; padding:6px 10px; max-height:240px; overflow:auto; white-space:pre-wrap; word-break:break-all; font-size:11px; line-height:1.5; color:#475569; border-top:1px dashed #c7d2fe; }
.think .tool-pending { margin:6px 0; border:1px dashed #c7d2fe; border-radius:6px; background:#eef2ff; padding:3px 8px; color:#4f46e5; font-size:12px; }
.think .tool-pending::after { content:'…'; animation: anda-dots 1.2s steps(1,end) infinite; }
@keyframes anda-dots { 0%{content:''} 25%{content:'.'} 50%{content:'..'} 75%{content:'...'} }
.think .reason-text { white-space:pre-wrap; }
</style>
</head>
<body>
    <!-- 三栏总布局 -->
<div class="layout">
  <!-- 左栏 -->
  <aside class="col col-left">
    <!-- 文件管理器（VS Code 资源管理器风格） -->
    <section class="panel file-manager">
        <!-- 面板标题 -->
      <div class="panel-header"><span>📂 文件管理器</span></div>
      <!-- 根行：折叠箭头 + 工具条（上传/刷新/全部折叠，hover 浮现） -->
      <div class="fm-root" id="fm-root">

(function () {
  const backdrop = document.createElement('div');
  backdrop.className = 'm-backdrop';
  document.body.appendChild(backdrop);
  window.closeDrawers = function () {
    document.querySelectorAll('.col-left, .col-right').forEach(function (el) { el.classList.remove('open'); });
    backdrop.classList.remove('show');
  };
  function toggleDrawer(sel) {
    const el = document.querySelector(sel);
    if (!el) return;
    const willOpen = !el.classList.contains('open');
    window.closeDrawers();
    if (willOpen) { el.classList.add('open'); backdrop.classList.add('show'); }
  }
  const bl = document.getElementById('btn-left');
  const br = document.getElementById('btn-right');
  if (bl) bl.addEventListener('click', function () { toggleDrawer('.col-left'); });
  if (br) br.addEventListener('click', function () { toggleDrawer('.col-right'); });
  backdrop.addEventListener('click', window.closeDrawers);
})();
</script>
<script>
// 未登录跳回首页
// 从登录状态获取 token
const token = localStorage.getItem('token');
// 如果 token 不存在，跳回首页
if (!token) { location.href = '../index.html'; }
// 定义 API 函数
const api = async (url, opts={}) => {
  try {
    // 发送 API 请求
    const res = await fetch(url, { headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+token }, ...opts });
    // 解析 JSON：500 等错误页不是 JSON，也不丢真实状态码（status 0 只代表真的连不上）
    let data = {};
    try { data = await res.json(); } catch {}
    // 返回 API 响应（status 供调用方区分 401/网络失败等场景）
    return { ok: res.ok, status: res.status, data };
    // 如果 API 请求失败，返回错误响应
  } catch { return { ok:false, status:0, data:{} }; }
};
const $ = id => document.getElementById(id);

// ===== 左栏上：资源管理器（VS Code 风格，真实数据：GET /upload/ 当前用户自己的文件） =====
// 上传目录本身是平的，这里按扩展名分到虚拟文件夹展示（图片/文档/表格/演示/压缩包）
const FM_GROUPS = [
  { key:'图片',   icon:'🖼', exts:['png','jpg','jpeg','gif','webp','bmp'] },
  { key:'文档',   icon:'📄', exts:['pdf','doc','docx','txt','md'] },
  { key:'表格',   icon:'📊', exts:['xls','xlsx','csv'] },
  { key:'演示',   icon:'📽', exts:['ppt','pptx'] },
  { key:'压缩包', icon:'🗜', exts:['zip'] },
];
const fmOpenGroups = new Set(FM_GROUPS.map(g => g.key));  // 展开的分组（默认全展开）
let fmRootOpen = true;                                     // 根节点是否展开

const fmGroupOf = name => {
  const ext = (name.split('.').pop() || '').toLowerCase();
  return FM_GROUPS.find(g => g.exts.includes(ext)) || { key:'其他', icon:'📦' };
};

// 状态行（空态/重试/过期提示统一走这里）
function fmMsg(text, color) {
  const li = document.createElement('li');
  li.className = 'fm-msg';
  li.style.color = color || '';
  li.textContent = text;
  return li;
}

// 每类文件的专属图标（像资源管理器按类型着色）
const FM_ICONS = { png:'🖼️', jpg:'🖼️', jpeg:'🖼️', gif:'🖼️', webp:'🖼️', bmp:'🖼️', pdf:'📕', doc:'📘', docx:'📘', xls:'📗', xlsx:'📗', csv:'📊', ppt:'📙', pptx:'📙', txt:'📃', md:'📝', zip:'🗜️' };
const extOf = name => (name.split('.').pop() || '').toLowerCase();
const iconOf = name => FM_ICONS[extOf(name)] || '📄';

// 渲染树：我的文件 → 类型文件夹（可折叠）→ 文件（点击预览，悬停出下载）
let fmFiles = [];   // 当前用户的已上传文件名列表（send 时校验正文 @引用 是否真实存在）
function renderFm(files) {
  fmFiles = files;
  const box = $('fm-tree');
  box.innerHTML = '';
  const fmt = n => n < 1024 ? n + ' B' : n < 1048576 ? (n/1024).toFixed(1) + ' KB' : (n/1048576).toFixed(1) + ' MB';
  if (!files.length) {
    box.appendChild(fmMsg('还没有文件，点 ⇪ 或对话框 ＋ 上传一个吧 ~'));
    return;
  }
  const groups = new Map();
  files.forEach(f => {
    const g = fmGroupOf(f.file_name);
    if (!groups.has(g.key)) groups.set(g.key, []);
    groups.get(g.key).push(f);
  });
  groups.forEach((items, key) => {
    const node = document.createElement('li');            // 类型文件夹节点
    const open = fmOpenGroups.has(key);
    const row = document.createElement('div');
    row.className = 'fm-row';
    const chev = document.createElement('span');
    chev.className = 'fm-chevron' + (open ? '' : ' closed');
    chev.textContent = '▼';
    const icon = document.createElement('span');
    icon.textContent = '📁';
    const name = document.createElement('span');
    name.className = 'fm-name';
    name.textContent = key;
    const count = document.createElement('span');
    count.className = 'fm-count';
    count.textContent = items.length;
    row.append(chev, icon, name, count);
    row.onclick = () => { fmOpenGroups.has(key) ? fmOpenGroups.delete(key) : fmOpenGroups.add(key); renderFm(files); };
    node.appendChild(row);
    if (open) {
      const kids = document.createElement('ul');          // 子层级：缩进 + 竖线导轨
      kids.className = 'fm-children';
      items.forEach(f => {
        const li = document.createElement('li');
        li.className = 'fm-row';
        const ghost = document.createElement('span');     // 占位，让文件图标与文件夹图标对齐
        ghost.className = 'fm-chevron';
        ghost.style.visibility = 'hidden';
        const fi = document.createElement('span');
        fi.textContent = iconOf(f.file_name);
        const fn = document.createElement('span');
        fn.className = 'fm-name';
        fn.textContent = f.file_name;
        const sz = document.createElement('span');
        sz.className = 'fm-size';
        sz.textContent = fmt(f.size);
        const dl = document.createElement('button');      // 悬停浮出的下载按钮
        dl.className = 'fm-dl';
        dl.textContent = '⬇';
        dl.title = '下载';
        dl.onclick = e => { e.stopPropagation(); downloadFile(f.file_name); };
        const rf = document.createElement('button');      // 悬停浮出的引用按钮：插到对话框
        rf.className = 'fm-ref';
        rf.textContent = '＠';
        rf.title = '引用到对话框';
        rf.onclick = e => { e.stopPropagation(); insertRef(f.file_name); };
        const del = document.createElement('button');     // 悬停浮出的删除按钮
        del.className = 'fm-del';
        del.textContent = '✕';
        del.title = '删除该文件';
        del.onclick = e => { e.stopPropagation(); removeFile(f.file_name); };
        li.title = `${f.file_name}\n${fmt(f.size)} · ${f.uploaded_at || ''} · 点击预览 · ＠引用`;
        li.append(ghost, fi, fn, sz, rf, del, dl);
        li.onclick = () => previewFile(f.file_name);
        kids.appendChild(li);
      });
      node.appendChild(kids);
    }
    box.appendChild(node);
  });
}

async function loadFiles() {
  const box = $('fm-tree');
  box.innerHTML = '';
  const { ok, status, data } = await api('/upload/');
  if (status === 401) {
    box.appendChild(fmMsg('登录已过期，正在跳转登录页…', '#f14c4c'));
    setTimeout(() => location.href = '../index.html', 1200);
    return;
  }
  if (status === 0 || status >= 500) {
    // 加载瞬间后端可能正在重启：自动重试直到拿到结果，不再一次性摆烂
    box.appendChild(fmMsg(`${status === 0 ? '连不上后端(8000)' : '后端出错(HTTP ' + status + ')'}，5秒后自动重试…`, '#e2c08d'));
    setTimeout(loadFiles, 5000);
    return;
  }
  if (!ok || !data || data.code !== 0) {
    box.appendChild(fmMsg(`获取失败：${(data && (data.message || data.detail)) || 'HTTP ' + status}`, '#e2c08d'));
    return;
  }
  renderFm(data.data || []);
}

// ===== 文件下载与预览（fetch 带请求头取回二进制：img/iframe 标签带不了 Authorization） =====
const PREVIEW_IMG = ['png','jpg','jpeg','gif','webp','bmp'];
const PREVIEW_TEXT = ['txt','md','csv','json','log'];

function toast(msg, duration = 2500) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), duration);
}

async function fetchBlob(fileName) {
  const res = await fetch('/upload/download/' + encodeURIComponent(fileName), {
    headers: { 'Authorization': 'Bearer ' + token },
  });
  if (!res.ok) {
    let msg = 'HTTP ' + res.status;
    try { msg = (await res.json()).message || msg; } catch {}
    throw new Error(msg);
  }
  return res.blob();
}

async function downloadFile(fileName) {
  try {
    const blob = await fetchBlob(fileName);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = fileName;
    a.click();
    URL.revokeObjectURL(a.href);
    toast('已开始下载：' + fileName);
  } catch (err) {
    toast('下载失败：' + err.message);
  }
}

const previewMask = $('preview-mask');

// 删除文件：二次确认后调 DELETE 接口，成功刷新左栏树
async function removeFile(fileName) {
  if (!confirm(`确定删除「${fileName}」吗？删除后无法恢复哦`)) return;
  try {
    const res = await fetch('/upload/' + encodeURIComponent(fileName), {
      method: 'DELETE',
      headers: { 'Authorization': 'Bearer ' + token },
    });
    let data = {};
    try { data = await res.json(); } catch {}
    if (res.ok && data.code === 0) {
      toast('已删除：' + fileName);
      loadFiles();
    } else {
      toast('删除失败：' + (data.message || data.detail || 'HTTP ' + res.status));
    }
  } catch {
    toast('删除失败：后端(8000)未启动或网络中断');
  }
}

function closePreview() { previewMask.classList.remove('show'); }

async function previewFile(fileName) {
  const ext = extOf(fileName);
  const canPreview = PREVIEW_IMG.includes(ext) || PREVIEW_TEXT.includes(ext) || ext === 'pdf';
  if (!canPreview) {
    downloadFile(fileName);
    toast('该类型暂不支持预览，已直接下载');
    return;
  }
  const body = $('preview-body');
  $('preview-title').textContent = fileName;
  $('preview-download').onclick = () => downloadFile(fileName);
  $('preview-close').onclick = closePreview;
   $('preview-icon').textContent = iconOf(fileName);
  $('preview-ext').textContent = ext || 'file';
  previewMask.classList.add('show');
  body.className = 'preview-body';
  body.innerHTML = '<div class="pv-loading"></div>';
  try {
    const blob = await fetchBlob(fileName);
    if (PREVIEW_IMG.includes(ext)) {
           body.classList.add('pv-img');
      const img = document.createElement('img');       // 图片：直接看图，点击放大/还原
      img.src = URL.createObjectURL(blob);
      img.onclick = () => img.classList.toggle('pv-zoomed');
      body.innerHTML = ''; body.appendChild(img);
    } else if (ext === 'pdf') {
      const frame = document.createElement('iframe');  // PDF：浏览器原生渲染
      frame.src = URL.createObjectURL(blob);
      body.innerHTML = ''; body.appendChild(frame);
    } else {
      const text = await blob.text();                  // 文本类：显示原文
      const pre = document.createElement('pre');
      pre.textContent = text;                          // textContent 赋值，天然防注入
      body.innerHTML = ''; body.appendChild(pre);
    }
   } catch (err) {
    body.innerHTML = '<div class="pv-error"><span class="pv-err-icon">⚠️</span>加载失败：' + err.message + '</div>';
  }
}
// 点遮罩空白处也能关掉预览
previewMask.onclick = e => { if (e.target === previewMask) closePreview(); };
// 按 Esc 也能关掉预览
document.addEventListener('keydown', e => { if (e.key === 'Escape' && previewMask.classList.contains('show')) closePreview(); });

loadFiles();

// ===== 左栏下：历史对话（localStorage 持久化） =====
// 从 localStorage 中获取历史对话
let history = (() => { try { return JSON.parse(localStorage.getItem('agent_history') || '[]') || []; } catch { localStorage.removeItem('agent_history'); return []; } })();

// 渲染历史对话列表
function renderHistory() {

    const del = document.createElement('span');
del.className = 'del-btn';
del.textContent = '−';
del.title = '删除该对话';
del.onclick = e => {

div.appendChild(del);

// 切换到指定对话
function selectChat(id) {
    // 切换到指定对话
  currentChatId = id;
  refs = []; renderRefs();   // 引用不跨对话残留：切走就清空，防止上个对话的文件带进这条消息
  let pendingTools = [];   // 暂存 AI 工具消息，遇到其后的 ai 消息时并入思维面板

  const h = history.find(x=>x.id===id);

  $('chat-messages').innerHTML = '';

    // 渲染消息
    // 将消息添加到父元素
    // 渲染历史对话列表
  (h?.messages||[]).forEach(m => {

    // 消息的思维面板（落库顺序保证 tool 先于 ai）；nav 成功结果额外出导航卡片
    if (m.role === 'tool' && m.tool && m.tool !== 'upload') {
      if (m.tool === 'nav') {
        try { const r = JSON.parse(m.content); if (r && r.ok) appendNavCard(r); } catch {}
      }
      pendingTools.push({ tool_name: m.tool, content: m.content });

// 流式对话：SSE 逐块渲染 + 可折叠思考过程面板（模型不下发 reasoning 时自动隐藏）
async function sendStream(text, refsList) {
  const div = document.createElement('div'); div.className = 'msg ai';
  const bubble = document.createElement('div'); bubble.className = 'bubble';
  const think = document.createElement('details'); think.className = 'think';
  think.innerHTML = '<summary>-思考过程-</summary><div class="think-body"></div>';
  const body = document.createElement('div');
  bubble.append(think, body);
  div.appendChild(bubble);   // 关键：气泡挂进消息行，否则全程游离、流式渲染不可见
  const box = $('chat-messages');
  box.appendChild(div);
  let answer = '', reasoning = '', sawThink = false;
  // 思维面板分段渲染：思维文本段与工具调用行按到达顺序交替——工具行天然落在思维流的
  // 真实时间位置（第几轮调用就在哪），后续思维另起一段，实现"跟着模型的思维面走"
  const thinkBody = think.querySelector('.think-body');
  let reasonSpan = null;
  let pendTool = null;   // "正在调用工具"占位行，结果到达后替换为真实工具行
  const newReasonSpan = () => {
    reasonSpan = document.createElement('span');
    reasonSpan.className = 'reason-text';
    thinkBody.appendChild(reasonSpan);
  };
  try {
    const res = await fetch('/agent/chat/stream', { method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+token },
      body: JSON.stringify({ utterance:text, refs:refsList, chat_id: currentChatId }) });
    if (!res.ok || !res.body) throw new Error('http ' + res.status);
    const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = '';
    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream:true });
      const parts = buf.split('\n\n'); buf = parts.pop();
      for (const p of parts) {
        const line = p.trim(); if (!line.startsWith('data:')) continue;
        const payload = line.slice(5).trim(); if (payload === '[DONE]') continue;
        let ev; try { ev = JSON.parse(payload); } catch { continue; }
        if (ev.type === 'tool_start') {
          // 执行前先亮出"正在调用工具：XXX"占位行，结果到达（tools 事件）后替换为可展开详情
          if (!sawThink) { think.open = true; sawThink = true; }
          reasonSpan = null;
          if (pendTool) pendTool.remove();
          pendTool = document.createElement('div');
          pendTool.className = 'tool-pending';
          pendTool.textContent = '正在调用工具：' + ((ev.names || []).join('、') || '…');
          thinkBody.appendChild(pendTool);
          box.scrollTop = box.scrollHeight;
        } else if (ev.type === 'tools') {
          // 工具调用并入思维面板：一行"调用工具：XXX >"，点击展开看返回详情
          if (pendTool) { pendTool.remove(); pendTool = null; }   // 占位行让位给真实结果
          if (!sawThink) { think.open = true; sawThink = true; }
          reasonSpan = null;   // 工具行截断当前思维段，之后新思维另起一段
          (ev.tool_calls||[]).forEach(t => {
            thinkBody.appendChild(makeToolItem(t.tool_name, JSON.stringify(t.result || {}, null, 2)));
            // nav 的成功结果仍出独立导航卡片（要点按钮直达高德，不能只收在折叠里）
            if (t.tool_name === 'nav') {
              try { const r = t.result || {}; if (r.ok) appendNavCard(r); } catch {}
            }
            // 提醒设置成功 → 自动下载 ICS 日历文件，引导用户用系统日历打开（到点前至少5分钟响铃）
            if (t.tool_name === 'reminder_set') {
              try {
                const r = t.result || {};
                if (r.ok && r.reminder?.id) {
                  downloadIcs('/reminder/' + r.reminder.id + '/ics', 'reminder-' + r.reminder.id + '.ics',
                    '已自动下载提醒的日历文件，请用系统日历打开（双击文件或在日历App里导入），到点前至少5分钟会响铃');
                }
              } catch {}
            }
          });
          box.scrollTop = box.scrollHeight;
        } else if (ev.type === 'reasoning') {
          if (!sawThink) { think.open = true; sawThink = true; }
          if (!reasonSpan) newReasonSpan();
          reasoning += ev.delta;   // 变量留一份入历史，DOM 只管实时显示
          reasonSpan.textContent += ev.delta;
          box.scrollTop = box.scrollHeight;
        } else if (ev.type === 'content') {
          if (sawThink) think.open = false;   // 正文开始，思考面板自动收起
          answer += ev.delta; body.textContent = answer;
          box.scrollTop = box.scrollHeight;
        } else if (ev.type === 'error') {
          answer += '\n\n⚠️ ' + (ev.message || '回复中途中断');
          body.textContent = answer;
        } else if (ev.type === 'done') {
          if (ev.answer) { answer = ev.answer; body.textContent = answer; }
        }
      }
    }
    if (!answer) body.textContent = '（无回复）';
    // 思考面板没收到任何内容时隐藏，避免留个空壳
    if (!sawThink) think.style.display = 'none';
    return { answer, reasoning };
  } catch {
    if (answer) {
      // 连接中断：已收到的内容照常保留并入历史，只追加中断提示（文章 5.3 的工程实践）
      body.textContent = answer + '\n\n⚠️ 连接中断，回复可能不完整';
      return { answer, reasoning };
    }
    body.textContent = '服务暂不可用，请稍后重试~';
    think.style.display = 'none';
    return { answer: '', reasoning: '' };
  }
}

// ===== 输入区：语音输入 —— WebAudio 采 PCM 编码 WAV → /asr 转写 → 文字回填输入框 =====
// 为什么用 WAV：所有 ASR 服务都吃 WAV，不赌浏览器 MediaRecorder 的 webm/opus 兼容性
let rec = null;   // 录音会话 {stream, ctx, node, chunks, start, timer}
const MAX_REC_MS = 60 * 1000;

function encodeWav(chunks, sampleRate) {
  const len = chunks.reduce((a, c) => a + c.length, 0);
  const buf = new ArrayBuffer(44 + len * 2); const v = new DataView(buf);
  const ws = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  ws(0,'RIFF'); v.setUint32(4, 36 + len*2, true); ws(8,'WAVE'); ws(12,'fmt ');
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,sampleRate,true); v.setUint32(28,sampleRate*2,true);
  v.setUint16(32,2,true); v.setUint16(34,16,true); ws(36,'data'); v.setUint32(40,len*2,true);
  let off = 44;
  for (const c of chunks) for (let i = 0; i < c.length; i++, off += 2) {
    const s = Math.max(-1, Math.min(1, c[i]));
    v.setInt16(off, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
  }
  return new Blob([buf], { type: 'audio/wav' });
}

function stopRec(send = true) {
  if (!rec) return;
  const { stream, ctx, node, chunks, timer, start } = rec; rec = null;
  clearInterval(timer);
  try { node.disconnect(); stream.getTracks().forEach(t => t.stop()); ctx.close(); } catch {}
  const mic = $('mic-btn');
  mic.classList.remove('mic-rec'); mic.textContent = '…';
  if (!send) { mic.textContent = '🎤'; return; }
  const blob = encodeWav(chunks, ctx.sampleRate);
  if (blob.size < 2000) { mic.textContent = '🎤'; alert('没录到声音，再试一次吧 ~'); return; }
  const fd = new FormData(); fd.append('audio', blob, 'voice.wav');
  fetch('/asr', { method:'POST', headers:{ 'Authorization':'Bearer '+token }, body: fd })
    .then(r => r.json().then(j => ({ ok: r.ok, j })).catch(() => ({ ok: r.ok, j: {} })))
    .then(({ ok, j }) => {
      const text = ok && j.code === 0 ? ((j.data && j.data.text) || '') : '';
      if (text) {
        const input = $('chat-input');
        input.value = input.value ? input.value + ' ' + text : text;   // 回填输入框，用户确认修正后再发
        input.focus();
      } else {
        alert((j && (j.message || j.detail)) || '语音识别失败，请直接打字 ~');
      }
    })
    .catch(() => alert('语音服务不可用，请直接打字 ~'))
    .finally(() => { $('mic-btn').textContent = '🎤'; });
}

$('mic-btn').onclick = async () => {
  if (rec) { stopRec(true); return; }   // 再点一下 = 说完了，停止并转写

  catch { alert('无法访问麦克风，请检查浏览器权限（地址栏左侧允许麦克风）'); return; }
  const ctx = new (window.AudioContext || window.webkitAudioContext)();

  const mute = ctx.createGain(); mute.gain.value = 0;   // ScriptProcessor 须连到 destination 才出数据，静音防回声
  const chunks = [];
  node.onaudioprocess = e => { if (rec) chunks.push(new Float32Array(e.inputBuffer.getChannelData(0))); };
  src.connect(node); node.connect(mute); mute.connect(ctx.destination);
  rec = { stream, ctx, node, chunks, start: Date.now(), timer: null };
  const mic = $('mic-btn');
  mic.classList.add('mic-rec'); mic.textContent = '⏹ 0s';
  rec.timer = setInterval(() => {
    if (!rec) return;
    const sec = Math.round((Date.now() - rec.start) / 1000);
    mic.textContent = '⏹ ' + sec + 's';

  }, 250);

const MAX_FILES = 5;

const fmtSize = n => n < 1024 ? n + ' B' : n < 1048576 ? (n/1024).toFixed(1) + ' KB' : (n/1048576).toFixed(1) + ' MB';

function uploadFile(file) {
  return new Promise(resolve => {
    const bubble = makeBubble();
    const ext = (file.name.split('.').pop() || '').toLowerCase();
    const head = `📎 ${file.name} (${fmtSize(file.size)})`;
    const fail = msg => { bubble.className = 'bubble err'; bubble.textContent = `${head}\n✕ ${msg}`; resolve(false); };
    if (!OK_EXT.includes(ext)) return fail(`不支持 .${ext || '未知'} 格式的文件`);
    if (file.size > MAX_SIZE) return fail('超过 10MB 上限，压缩一下再传吧~');
    if (!file.size) return fail('文件内容为空');
    const send = () => {
      bubble.className = 'bubble';
      bubble.onclick = null;
      bubble.textContent = `${head}\n上传中 0%`;
      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/upload/');
      xhr.setRequestHeader('Authorization', 'Bearer ' + token);
      xhr.upload.onprogress = ev => {
        if (ev.lengthComputable) bubble.textContent = `${head}\n上传中 ${Math.round(ev.loaded / ev.total * 100)}%`;
      };
      xhr.onload = () => {
        let res = {};
        try { res = JSON.parse(xhr.responseText) || {}; } catch {}
        if (xhr.status === 200 && res.code === 0) {
          bubble.className = 'bubble ok';
          const fid = (res.data && res.data.file_id) || '-';
          bubble.textContent = `${head}\n✓ 上传成功 · file_id: ${fid}`;
          pushToolHistory(`上传 ${file.name} 成功（file_id: ${fid}）`);
          if (typeof revealFile === 'function') revealFile(file.name); // 左栏资源管理器同步刷新并展开分组
          return resolve(true);
        }
        if (xhr.status === 401) {
          fail((res.detail || res.message || '登录已过期') + '，即将返回登录页');
          localStorage.removeItem('token');
          return setTimeout(() => location.href = '../index.html', 1000);
        }
        bubble.className = 'bubble err';
        bubble.textContent = `${head}\n✕ 上传失败：${res.message || res.detail || 'HTTP ' + xhr.status}\n（点击气泡重试）`;
        bubble.onclick = send;
        resolve(false);
      };
      xhr.onerror = () => {
        bubble.className = 'bubble err';
        bubble.textContent = `${head}\n✕ 上传失败：后端(8000)未启动或网络中断\n（点击气泡重试）`;
        bubble.onclick = send;
        resolve(false);
      };
      const form = new FormData();
      form.append('file', file);
      xhr.send(form);
    };
    send();
  });
}

chatInputArea.addEventListener('dragenter', e => {
  if (![...(e.dataTransfer?.types || [])].includes('Files')) return;
  e.preventDefault(); dragDepth++;
  chatInputArea.classList.add('drag-over');
});
chatInputArea.addEventListener('dragover', e => {
  if (![...(e.dataTransfer?.types || [])].includes('Files')) return;

  e.dataTransfer.dropEffect = 'copy';

  dragDepth = 0;

  if (files.length > MAX_FILES) appendMessage('tool', `一次最多 ${MAX_FILES} 个文件，先传前 ${MAX_FILES} 个哦`, 'upload');

async function downloadIcs(path, filename, tip) {
  try {
    const res = await fetch(path, { headers: { Authorization: 'Bearer ' + localStorage.getItem('token') } });
    if (!res.ok) { toast('导出失败：' + (res.status === 401 ? '登录过期' : 'HTTP ' + res.status)); return; }
    const blob = await res.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
    URL.revokeObjectURL(a.href);
    toast(tip || ('已下载 ' + filename + '，打开即可导入系统日历（会提前至少5分钟提醒）'));
  } catch { toast('导出失败：后端未启动或网络异常'); }
}

const firedReminders = new Set();   // 本轮会话内已弹过的 id，避免重复打扰

// 提醒音效：Web Audio 现场合成"叮-咚"，无需音频文件；浏览器自动播放策略要求先有用户手势，首次点击/按键时解锁
let audioCtx = null;
const requestNotify = () => { try { if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission(); } catch {} };
const unlockAudio = () => { try { audioCtx && audioCtx.resume(); } catch {} requestNotify(); };   // 顺带申请系统通知权限（浏览器要求用户手势才弹授权框）
document.addEventListener('pointerdown', unlockAudio);
document.addEventListener('keydown', unlockAudio);
function playDing() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const now = audioCtx.currentTime;
    [880, 1174.7].forEach((freq, i) => {   // 两声：叮（A5）→ 哮（D6）
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine'; osc.frequency.value = freq;
      const t0 = now + i * 0.28;
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(0.3, t0 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.25);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t0); osc.stop(t0 + 0.3);
    });
  } catch {}
}

// 系统级通知：浏览器最小化/在后台时，Windows 右下角也能弹提醒（localhost 属安全上下文，可直接用 Notification）
let notifyHintShown = false;   // 被拒绝的提示每次会话只弹一次，不啯嗦
function notifySystem(r) {
  try {
    if (!('Notification' in window)) return;
    if (Notification.permission === 'denied') {
      if (!notifyHintShown) {
        notifyHintShown = true;
        toast('系统通知未授权：点地址栏右侧的图标允许"通知"，才能在浏览器最小化时弹 Windows 提醒', 6000);
      }
      return;
    }
    if (Notification.permission !== 'granted') return;   // 'default'：首次手势还没发生，下一轮再试
    const n = new Notification('⏰ 安答提醒', {
      body: r.reminder_type + (r.reminder_time ? '（' + r.reminder_time + '）' : ''),
      tag: 'reminder-' + r.id,   // 同一条提醒重复触发时替换旧通知，不堆叠
    });

  } catch {}
}

  (data.data || []).forEach(r => {
    if (firedReminders.has(r.id)) return;
    const isLesson = String(r.id).startsWith('c-');   // 后端合成的课前提醒（c-日期-课id，仅在课前10分钟窗口返回）
    if (isLesson) {
      // 双保险：课前提醒过期不弹——错过就错过（网页版定位如此，系统日历版负责"错不过"）
      const hm = r.reminder_time || '';
      if (!/^\d{1,2}:\d{2}$/.test(hm)) return;
      const [hh, mm] = hm.split(':').map(Number);
      const d = new Date();
      const at = hh * 60 + mm, nowMin = d.getHours() * 60 + d.getMinutes();
      if (nowMin < at - 10 || nowMin > at) return;
    }
    firedReminders.add(r.id);
    playDing();   // 先出声：toast 只有几秒，没声音很容易错过
    notifySystem(r);   // 系统级通知：窗口不在前台时靠它到点弹

      + (r.reminder_time ? '（' + r.reminder_time + '）' : ''), 8000);
  });
}

// 初始化时，选择第一个对话
if (history.length) selectChat(history[0].id); else newChat();

// ===== 聊天记录跨设备同步：登录后以服务端为准（换浏览器/换设备能看到完整记录） =====
(async () => {
  if (!token) return;
  try {
    const res = await fetch('/agent/history', { headers:{ 'Authorization':'Bearer '+token } });
    if (!res.ok) return;
    const r = await res.json();
    if (r.code !== 0 || !Array.isArray(r.data) || !r.data.length) return;
    // 云端有记录：云端为准覆盖本地，顺带清掉同浏览器换账号时的残留记录
    history = r.data;
    localStorage.setItem('agent_history', JSON.stringify(history));
    if (history.some(x => x.id === currentChatId)) {
      selectChat(currentChatId);            // 当前对话云端也有 → 用云端内容重放
    } else {
      currentChatId = null;
      $('chat-messages').innerHTML = '';
      renderHistory();
    }
  } catch { /* 后端不可达：继续用本地缓存 */ }
})();

// ===== 上报当前位置（导航工具依赖 /nav/location，后端缓存30分钟） =====
// 浏览器首次会弹定位授权；拒绝也不影响其他功能，只是对话问"怎么去XX"时会提示先点 📍 按钮
let locating = false;   // 防抖：定位进行中不重复触发
async function reportLocation(manual = false) {
  if (!navigator.geolocation) { if (manual) toast('浏览器不支持定位'); return; }
  if (locating) return;
  locating = true;
  if (manual) toast('正在获取定位…');
  navigator.geolocation.getCurrentPosition(async (pos) => {
    locating = false;
    try {
      const { ok } = await api('/nav/location', { method: 'POST',
        body: JSON.stringify({ lng: pos.coords.longitude, lat: pos.coords.latitude }) });
      if (manual) toast(ok ? '定位成功！现在可以问"怎么去逸夫楼"啦~' : '定位上报失败，请重试');
    } catch { if (manual) toast('定位上报失败，请确认后端已启动'); }
  }, (err) => {
    locating = false;
    // err.code: 1=权限被拒 2=拿不到位置 3=超时
    if (manual) toast(err.code === 1 ? '定位被拒绝：请在浏览器地址栏允许位置权限' : '定位失败，请重试');
  }, { enableHighAccuracy: false, timeout: 10000, maximumAge: 600000 });
}
$('loc-btn').addEventListener('click', () => reportLocation(true));   // 手动定位按钮
reportLocation();   // 页面加载时静默尝试一次（用户授权过就直接上报，无需再点）
</script>
