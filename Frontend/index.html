<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安答：校园AI Agent助手</title>
        <link rel="stylesheet" href="./assets/style.css">
    <!-- 手机端缩小看板娘：远程 waifu.css 是动态插入 head 的（晚于本标签），用 body 前缀抬高特异性确保覆盖；电脑端不受影响 -->
    <style>
        @media (max-width: 768px) {
            body #waifu { transform: scale(0.6); transform-origin: bottom left; }
        }
    </style>
</head>
</head>
<body>
    <div class="container">
        <div class="header">
            <!-- assets/anda.ico 已创建 -->
            <link rel="icon" href="./assets/anda.ico" type="image/x-icon">
            <div class="logo">安 答</div>
        </div>
        <div class="main">
            <!-- 核心展示区 -->
            <div class="hero-section">
                <div class="title">安答：校园AI Agent助手</div>
                <div class="subtitle">从“被动问答”到“主动服务” —— 一句自然语言驱动课表、提醒与办事查询</div>
                <div class="notice">原版官方功能请转移至 ->安徽工业大学->智慧校园->安工小智</div>
            </div>

            <!-- 认证表单区：JS fetch 提交，token 存 localStorage -->
            <div class="auth-section">
                <form id="login-form" class="login-form">
                    <div class="form-group">
                        <label for="username">用户名</label>
                        <input type="text" id="username" name="username" placeholder="请输入用户名" required>
                    </div>
                    <div class="form-group">
                        <label for="password">密码</label>
                        <input type="password" id="password" name="password" placeholder="请输入密码" required>
                    </div>
                    <button type="submit" class="login-btn">登录</button>
                    <div id="login-msg"></div>
                </form>
                <div class="auth-links">
                    <a href="./pages/register.html">没有账号？立即注册</a>
                    <!-- 忘记密码链接：先输入邮箱申请重置链接（QQ邮箱SMTP发送） -->
                    <a href="./pages/forgot-password.html">忘记密码？</a>
                </div>
            </div>
        </div>
        <div class="footer">
            <div class="copyright">© 2026 安答. All rights reserved.</div>
        </div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault(); // 阻止整页跳转
            const msg = document.getElementById('login-msg');
            const btn = e.target.querySelector('button');
            btn.disabled = true;
            msg.textContent = '';
            try {
                const res = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('username').value.trim(),
                        password: document.getElementById('password').value,
                    }),
                });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('token', data.data.token);
                    location.href = './pages/agent_ai.html'; // agent_ai.html 第 1 期实现
                } else {
                    msg.textContent = data.message || '登录失败';
                }
            } catch (err) {
                msg.textContent = '网络错误，请稍后重试';
            } finally {
                btn.disabled = false;
            }
        });
    </script>
        <script>
    (function () {
        const live2d_path = 'https://gcore.jsdelivr.net/npm/live2d-widgets@1.0.1/dist/';
        function loadResource(url, type) {
            return new Promise(function (resolve, reject) {
                let tag;
                if (type === 'css') {
                    tag = document.createElement('link');
                    tag.rel = 'stylesheet';
                    tag.href = url;
                } else if (type === 'js') {
                    tag = document.createElement('script');
                    tag.type = 'module';
                    tag.src = url;
                }
                if (tag) {
                    tag.onload = function () { resolve(url); };
                    tag.onerror = function () { reject(url); };
                    document.head.appendChild(tag);
                }
            });
        }
        Promise.all([
            loadResource(live2d_path + 'waifu.css', 'css'),
            loadResource(live2d_path + 'waifu-tips.js', 'js'),
        ]).then(function () {
            initWidget({
                waifuPath: live2d_path + 'waifu-tips.json',
                cdnPath: 'https://gcore.jsdelivr.net/gh/fghrsh/live2d_api/',
                cubism2Path: live2d_path + 'live2d.min.js',
                cubism5Path: 'https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js',
                tools: ['hitokoto', 'asteroids', 'switch-model', 'switch-texture', 'photo', 'info', 'quit'],
                logLevel: 'warn',
                drag: false,
            });
        });
    })();
    </script>
</body>
</body>
</html>
